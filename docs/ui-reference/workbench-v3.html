      if (t.id === "btnToggleMatrix") { state.matrixExpanded = !state.matrixExpanded; render(); return; }
      if (t.id === "btnFilterIssues") { state.onlyShowIssues = !state.onlyShowIssues; render(); return; }
      if (t.id === "btnNextIssue") {
        const issues = getStats().issueCells;
        if (issues.length > 0) {
          const cur = issues.findIndex(c => c.key === state.activeCellKey);
          state.activeCellKey = issues[(cur + 1) % issues.length].key;
          render();
        }
        return;
      }
      if (t.id === "btnForkShared") {
        const c = state.cells[state.activeCellKey];
        const d = state.drafts.find(x => x.id === c.draftId);
        if (d) {
          d.sharedWith = null;
          d.customTable = `${d.name.slice(0, 4)} 独立副本`;
          if (!state.availableTables.includes(d.customTable)) state.availableTables.push(d.customTable);
          showToast(`已拆为 ${d.name} 独立译文副本`);
          render();
        }
        return;
      }
      if (t.dataset.pickCell) {
        if (t.dataset.pickMode === "step4") state.selectedStep4Cell = t.dataset.pickCell;
        else state.activeCellKey = t.dataset.pickCell;
        render();
        return;
      }
      if (t.dataset.resolveCell) {
        const c = state.cells[t.dataset.resolveCell];
        const iss = c.issues.find(i => i.id === t.dataset.resolveIss);
        const idx = Number(t.dataset.resolveIdx);
        iss.chosen = (idx === 0 && iss.fixPreview) ? iss.fixPreview : iss.options[idx];
        if (!iss.resolved) state.patchCount++;
        iss.resolved = true;
        if (c.issues.every(i => i.resolved)) c.status = "confirmed";
        if (iss.sharedKey) state.lastSharedResolved = { sharedKey: iss.sharedKey, chosenIdx: idx, label: iss.type };
        render();
        return;
      }
      if (t.id === "btnSyncShared" && state.lastSharedResolved) {
        const { sharedKey, chosenIdx } = state.lastSharedResolved;
        let cnt = 0;
        getActiveCells().forEach(c => {
          if (!c.enabled) return;
          c.issues.forEach(iss => {
            if (iss.sharedKey === sharedKey && !iss.resolved) {
              iss.chosen = (chosenIdx === 0 && iss.fixPreview) ? iss.fixPreview : iss.options[chosenIdx];
              iss.resolved = true;
              state.patchCount++;
              cnt++;
            }
          });
          if (c.issues.length > 0 && c.issues.every(i => i.resolved)) c.status = "confirmed";
        });
        state.lastSharedResolved = null;
        showToast(`已同步处理其余 ${cnt} 门`);
        render();
        return;
      }
      if (t.dataset.step3View) { state.step3View = t.dataset.step3View; render(); return; }
      if (t.id === "btnFixOptionalDetect") { state.optionalSmartDetectPending = 0; showToast("已补跑完成"); render(); return; }
      if (t.dataset.localSwap) {
        const d = state.drafts.find(x => x.id === t.dataset.localSwap);
        showToast(`已仅重算 ${d.name}，其余稿件状态保留`);
        return;
      }
      if (t.id === "btnRunBatch") { startBatchRun(getStats().dirtyCells.length > 0); return; }
      if (t.id === "btnInstantFinish") {
        clearInterval(state.runTimer);
        state.isRunning = false;
        state.hasCompletedOnce = true;
        let charged = 0;
        getActiveCells().forEach(c => {
          if (!c.enabled) return;
          if (c.key === "d05::VI") {
            c.execStatus = "failed";
            c.execNote = "越语变音符号回读校验未通过，已隔离不发布";
            state.selectedStep4Cell = c.key;
          } else if (c.key === "d06::NL") {
            c.execStatus = "review_needed";
            c.execNote = "荷语长复合词撑宽段落框，已写入源文件并标入复查";
          } else {
            c.execStatus = "verified";
            c.execNote = "保存后重开回读一致";
          }
          if (c.execStatus === "verified" || c.execStatus === "review_needed") charged++;
          if (c.status === "dirty") c.status = "confirmed";
        });
        state.lastChargedCredits = charged;
        state.creditsBalance = Math.max(0, state.creditsBalance - charged);
        showToast(`本机生成完成，实扣 ${charged} 积分（隔离门未扣费）`);
        render();
        return;
      }
      if (t.dataset.retryCell) {
        const c = state.cells[t.dataset.retryCell];
        c.execStatus = "verified";
        c.status = "confirmed";
        c.execNote = "单门重试通过 · 回读一致（已补扣 1 积分）";
        state.lastChargedCredits += 1;
        state.creditsBalance = Math.max(0, state.creditsBalance - 1);
        showToast("单门重试成功，已补扣 1 积分");
        render();
        return;
      }
      if (t.id === "btnExportCleanTable") {
        showToast(`已导出修正后译文表（含 ${state.patchCount} 项修复）`);
        return;
      }
      if (t.id === "btnSimReimport") {
        const c = state.cells["d02::ES"];
        c.status = "dirty";
        c.execNote = "仅检测到此门译文有更新，其余已完成门自动保留";
        state.selectedStep4Cell = "d02::ES";
        showToast("已识别变更：仅需重跑 5857_02 · 西班牙语");
        render();
        return;
      }
    });

    document.addEventListener("change", e => {
      const gSel = e.target.closest("select[data-group-table]");
      if (gSel) {
        state.groupTables[gSel.dataset.groupTable] = gSel.value;
        showToast(`已更新「${gSel.dataset.groupTable}」整组译文源`);
        render();
        return;
      }
      const dSel = e.target.closest("select[data-draft-table]");
      if (dSel) {
        const d = state.drafts.find(x => x.id === dSel.dataset.draftTable);
        if (d) {
          d.customTable = dSel.value === "__INHERIT__" ? null : dSel.value;
          render();
        }
        return;
      }
      if (e.target.id === "selTypoScope") { state.typoScope = e.target.value; renderTypographyPanel(); return; }
      if (e.target.id === "selTypoFont") { const r = getTypoRule(state.typoLang, state.typoSourceId); r.font = e.target.value; r.customized = true; renderTypographyPanel(); return; }
      if (e.target.id === "selTypoWeight") { const r = getTypoRule(state.typoLang, state.typoSourceId); r.weight = e.target.value; r.customized = true; renderTypographyPanel(); return; }
    });

    document.addEventListener("input", e => {
      const id = e.target.id;
      if (!id || !id.startsWith("inpPs")) return;
      const r = getTypoRule(state.typoLang, state.typoSourceId);
      const val = Number(e.target.value);
      if (Number.isNaN(val)) return;
      if (id === "inpPsSize") r.sizePt = val;
      else if (id === "inpPsLeading") r.leadingPt = val;
      else if (id === "inpPsKerning") r.kerning = val;
      else if (id === "inpPsTracking") r.tracking = val;
      else if (id === "inpPsVScale") r.vScale = val;
      else if (id === "inpPsHScale") r.hScale = val;
      else if (id === "inpPsBaseline") r.baselinePt = val;
      r.customized = true;
      // Update live preview without stealing input focus
      const pv = document.querySelector(".typo-preview");
      if (pv) {
        const tRule = getTypoRule(state.typoLang, "sf_title");
        const bRule = getTypoRule(state.typoLang, "sf_body");
        const kids = pv.children;
        if (kids[0]) {
          kids[0].style.fontSize = `${Math.round(15 * tRule.sizePt / 100)}px`;
          kids[0].style.lineHeight = (tRule.leadingPt / 100).toFixed(2);
          kids[0].style.letterSpacing = `${(tRule.tracking / 1000).toFixed(3)}em`;
          kids[0].style.transform = `scale(${(tRule.hScale/100).toFixed(2)}, ${(tRule.vScale/100).toFixed(2)})`;
        }
        if (kids[1]) {
          kids[1].style.fontSize = `${Math.round(12.5 * bRule.sizePt / 100)}px`;
          kids[1].style.lineHeight = (bRule.leadingPt / 100).toFixed(2);
          kids[1].style.letterSpacing = `${(bRule.tracking / 1000).toFixed(3)}em`;
        }
      }
    });

    render();
  </script>
</body>
</html>
