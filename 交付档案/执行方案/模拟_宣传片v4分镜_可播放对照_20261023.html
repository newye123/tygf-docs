// ---------- 画面壳（虚构数据） ----------

      <div class="chips" style="margin:.5em 0">${['德语','法语','西班牙语','意大利语','葡萄牙语','俄语','日语','韩语','阿拉伯语','泰语','越南语','印尼语'].map(c=>`<span class="chip">${c}</span>`).join('')}</div>
      <table class="ui"><tr><th>#</th><th>原文</th><th>德语</th><th>日语</th></tr>
      <tr><td>1</td><td>Buy Now</td><td>Jetzt kaufen</td><td>今すぐ購入</td></tr>
      <tr><td>2</td><td>Free Shipping</td><td>Kostenloser Versand</td><td>送料無料</td></tr>

      <div class="row" style="margin-top:.6em;justify-content:flex-end"><span class="btn" data-cta>进入原文与译文审查 ›</span></div>

    case 'langcards':return `<div class="body"><div class="copy"><div class="eyebrow">${sh.en}</div><div class="head">${sh.head}</div><div class="plain">${sh.sub}</div></div>
      <div class="visual"><div class="grid" style="grid-template-columns:repeat(3,1fr)">${['DE','FR','ES','IT','PT','RU','JA','KO','AR'].map((c,i)=>`<div class="file"><b>${c}</b><div style="margin-top:.25em">${i<6?'<span class="ok">已检查</span>':(i<8?'<span class="warn">2 处待确认</span>':'<span class="bad">1 处阻断</span>')}</div><div class="bar" style="margin-top:.3em"><i style="width:${[100,100,100,96,100,100,88,92,70][i]}%"></i></div></div>`).join('')}</div></div></div>`;
    case 'triage':return `<div class="body"><div class="copy"><div class="eyebrow">${sh.en}</div><div class="head">${sh.head}</div><div class="plain">${sh.sub}</div></div>
      <div class="visual"><div class="card"><h4>就绪检查 · 还差 1 处要你决定</h4>
      <div class="row" style="padding:.45em 0;border-bottom:1px solid var(--line)"><span class="bad">要你决定</span><div style="flex:1"><b>详情 · 材质卖点</b><div style="font-size:.9em;color:var(--mut)">文字图层 / 副标题 · 缺少目标文本</div></div><span class="btn ghost" data-cta>前往补全</span></div>
      <div class="row" style="padding:.45em 0"><span class="ok">5 项可以不管</span><div style="flex:1;color:var(--mut)">不影响继续生成，可在对象清单中查看</div><span class="btn ghost">查看</span></div>
      </div></div></div>`;
    case 'exec':{const n=Math.round(p(0.35,0.9)*175);
      return `<div class="body"><div class="copy"><div class="eyebrow">${sh.en}</div><div class="head">${sh.head}</div><div class="plain">${sh.sub}</div></div>
      <div class="visual"><div class="card"><h4>Photoshop 正在写入当前语言</h4>

      <tr><td>副标 · 材质</td><td class="ok">已写入</td></tr>
      <tr><td>按钮 · 购买</td><td class="ok">已写入</td></tr>
      <tr><td>规格表 · 尺寸</td><td>${n>120?'<span class="ok">已写入</span>':'<span style="color:var(--mut)">排队中</span>'}</td></tr></table>
      </div></div></div>`;}
    case 'readback':return `<div class="body col" style="align-items:stretch;gap:.6em"><div><div class="eyebrow">${sh.en}</div><div class="head" style="font-size:1.55em">${sh.head}</div><div class="plain">${sh.sub}</div></div>
      <div class="visual" style="width:100%"><div class="card"><h4>核对报告 · 重新打开后逐层读回（示例稿 175 层）</h4>
      <table class="ui"><tr><th>文字层</th><th>设了什么</th><th>读回什么</th><th>一致</th></tr>

      <tr><td>副标 · 材质</td><td>100% Baumwolle</td><td>100% Baumwolle</td><td class="ok">✓</td></tr>
      <tr><td>按钮 · 购买</td><td>In den Warenkorb</td><td>In den Warenkorb</td><td class="ok">✓</td></tr>
      <tr class="hlrow"><td>尺码表 · 胸围</td><td>Brustumfang</td><td><span class="bad">Brustumfang </span>(尾空格)</td><td class="bad">✗ 单列</td></tr>
      <tr><td>角标 · 新品</td><td>NEU</td><td>NEU</td><td class="ok">✓</td></tr></table>
      <div class="row" style="margin-top:.5em"><span class="ok">174 一致</span><span class="bad">1 不一致（单独列出，不混在成功里）</span><span style="margin-left:auto;color:var(--mut)">非耗时承诺</span></div>
      </div></div></div>`;
    case 'deliver':return `<div class="body"><div class="copy"><div class="eyebrow">${sh.en}</div><div class="head">${sh.head}</div><div class="plain">${sh.sub}</div></div>
      <div class="visual"><div class="card"><h4>袖口_ALL_12LANG/</h4>
      <table class="ui"><tr><th>文件</th><th>大小</th><th>核对</th></tr>
      <tr><td>袖口_DE.psb</td><td>268 MB</td><td class="ok">✓ 已回读</td></tr>
      <tr><td>袖口_JA.psb</td><td>266 MB</td><td class="ok">✓ 已回读</td></tr>
      <tr><td>袖口_DE.jpg</td><td>4.1 MB</td><td class="ok">预览图</td></tr>
      <tr><td>图译工坊执行报告.html</td><td>312 KB</td><td class="ok">175 层逐条</td></tr></table>

}

// ---------- 渲染 ----------
const film=document.getElementById('film');
let T=0,playing=false,speed=1,subsOn=true,ar='169';
function shotAt(t){for(const s of SHOTS)if(t>=s.s&&t<s.e)return s;return SHOTS[SHOTS.length-1];}
function cueAt(sh,t){const d=sh.e-sh.s;const cut=Math.min(d-0.35,d*0.42);const rel=t-sh.s;
  if(!subsOn)return '';return rel<cut?sh.head:sh.cue;}
function render(t){
  const sh=shotAt(t),rel=t-sh.s,dur=sh.e-sh.s;
  const enter=Math.min(1,rel/0.45), ez=1-Math.pow(1-enter,3);
  let cam=`scale(${1+0.05*(rel/dur)})`;
  if(ar==='916')cam=`scale(${1+0.02*(rel/dur)})`;
  if(sh.zoom&&ar==='169'){const z=Math.min(1,Math.max(0,(rel-1.0)/0.9)),e=1-Math.pow(1-z,3);
    const cx=sh.zoom.x+sh.zoom.w/2,cy=sh.zoom.y+sh.zoom.h/2;
    cam=`translate(${Math.max(-14,Math.min(14,(50-cx)*e*0.42))}%, ${Math.max(-10,Math.min(10,(50-cy)*e*0.42))}%) scale(${1+0.3*e})`;}
  const cls=['pad',sh.ui?'':'centered'];
  film.innerHTML=`<div class="cam" style="transform:${cam}">
    <div class="${cls.join(' ')}" style="--uiscale:${ar==='916'?0.92:1}">
      <div class="masthead"><span class="brand">图译工坊</span><span class="counter">${String(SHOTS.indexOf(sh)+1).padStart(2,'0')} / ${SHOTS.length}</span></div>
      ${sh.ui?scene(sh.scene,rel,sh):scene(sh.scene,rel,sh)}
      <div class="foot"><span>图译工坊 · 内测中</span><span>示例数据 · 非耗时承诺</span></div>
    </div></div>
    <div class="subs">${cueAt(sh,rel)?`<span>${cueAt(sh,rel)}</span>`:''}</div>
    ${sh.click?cursorLayer(sh,rel):''}
  </div>`;
  film.classList.toggle('hl-on',!!(sh.hl&&rel>=sh.hl.at));
  if(sh.click){const tgt=film.querySelector('[data-cta]');
    if(tgt){const fr=film.getBoundingClientRect(),r=tgt.getBoundingClientRect();
      const x=((r.left+r.width/2-fr.left)/fr.width*100).toFixed(2),y=((r.top+r.height/2-fr.top)/fr.height*100).toFixed(2);
      film.querySelectorAll('[data-cur]').forEach(el=>{el.style.left=x+'%';el.style.top=y+'%'});}}
  if(ar==='916'){film.querySelectorAll('.body').forEach(b=>{b.classList.add('col');b.style.alignItems='stretch';b.style.gap='.7em';const v=b.querySelector('.copy');if(v)v.style.flex='0 0 auto';});}
  document.getElementById('clock').textContent=`${t.toFixed(2)} / ${DUR.toFixed(2)}s`;
  document.getElementById('scrub').value=t;
  document.querySelectorAll('.shot').forEach(el=>el.classList.toggle('act',+el.dataset.i===SHOTS.indexOf(sh)));
  const it=document.getElementById('intent');
  it.innerHTML=`<b>${sh.head}</b>（${dur.toFixed(1)} 秒）<br>${sh.intent}<div style="margin-top:6px;color:#8c877b">依据：${sh.src}</div>`;
}
// 光标落点不写死坐标：渲染后量真按钮的包围盒再摆（竖版重排后位置会变，写死必跑偏）
function cursorLayer(sh,rel){
  const c=sh.click,lead=0.55;
  if(rel<c.t-lead)return '';
  const a=Math.min(1,(rel-(c.t-lead))/0.35),fade=rel>c.t+1.2?Math.max(0,1-(rel-c.t-1.2)/0.5):1;
  const rip=rel>=c.t?`<div class="ripple" data-cur style="opacity:${Math.max(0,(1-(rel-c.t)/0.55))*fade};transform:translate(-50%,-50%) scale(${1+(rel-c.t)*3.2})"></div>`:'';
  return `<div class="cursor" data-cur style="opacity:${a*fade}"></div>${rip}`;
}
// ---------- 判据自检 ----------
function gates(){
  const txt=SHOTS.filter(s=>!s.ui&&!s.exempt),txtDur=txt.reduce((a,s)=>a+(s.e-s.s),0);
  const g=[];
  g.push(['一 · 纯文字镜单镜 ≤2.5s（落版豁免）',txt.every(s=>s.e-s.s<=2.5),txt.map(s=>`${s.id} ${(s.e-s.s).toFixed(1)}s`).join('、')||'无纯文字镜']);
  g.push(['二 · 非落版纯文字总长 ≤4s',txtDur<=4,`${txtDur.toFixed(1)}s（v3 同口径＝10.8s／31%）`]);
  g.push(['三 · 有主张的镜必须有界面像素',SHOTS.filter(s=>s.claim&&!s.ui).length===0,SHOTS.filter(s=>s.claim&&!s.ui).map(s=>s.id).join('、')||'全部满足（v3 违例：f02、f09）']);
  g.push(['四 · 字幕 ≤12 字/秒',SHOTS.every(s=>cps(s)<=12),`最险 ${Math.max(...SHOTS.map(s=>cps(s))).toFixed(1)} 字/秒（v3 实测 8/20 枚 cue 超限，最险 17.7）`]);
  const banned=SHOTS.flatMap(s=>REDLINE.filter(r=>{const k=r.split('／')[0];return (s.head+s.sub+s.cue).includes(k)}).map(r=>`${s.id}→${k}`));
  g.push(['五 · 画面文案不含禁列串',banned.length===0,banned.join('、')||'0 命中（禁词表见右下；画面像素文字仍需 OCR 闸，未建）']);
  return g;
}
function cps(s){return s.cue.replace(/[\s，。、·（）—]/g,'').length/(s.e-s.s);}
// ---------- UI 装配 ----------
function strip(el,data,total){
  el.innerHTML=data.map(d=>`<i class="${d[3]?(d[4]?'ex':'ui'):'tx'}" style="width:${(d[2]-d[1])/total*100}%" title="${d[0]}"></i>`).join('');
}
function build(){
  document.getElementById('shotlist').innerHTML=SHOTS.map((s,i)=>
    `<div class="shot" data-i="${i}"><span class="n">${i+1}</span><div><div class="t"><span class="dot ${s.exempt?'ex':(s.ui?'ui':'tx')}"></span>${s.head}</div><div class="w">${s.claim?'含对外主张':'无主张'} · ${cps(s).toFixed(1)} 字/秒</div></div><span class="m">${(s.e-s.s).toFixed(1)}s<br>${s.s.toFixed(1)}</span></div>`).join('');
  document.querySelectorAll('.shot').forEach(el=>el.onclick=()=>{seek(SHOTS[+el.dataset.i].s+0.01)});
  const g=gates();
  document.getElementById('gates').innerHTML=g.map(([n,ok,d])=>`<li><span class="pill ${ok?'pass':'fail'}">${ok?'PASS':'FAIL'}</span> ${n}<div class="note" style="margin-left:2px">${d}</div></li>`).join('');
  strip(document.getElementById('v3strip'),V3.map(v=>[v[0],v[1],v[2],v[3]]),35);
  strip(document.getElementById('v4strip'),SHOTS.map(s=>[s.id,s.s,s.e,s.ui?1:0,s.exempt?1:0]),DUR);
  const v3no=V3.filter(v=>!v[3]).reduce((a,v)=>a+v[2]-v[1],0);
  const v4no=SHOTS.filter(s=>!s.ui&&!s.exempt).reduce((a,s)=>a+s.e-s.s,0);
  document.getElementById('v3stat').textContent=`无界面 ${v3no.toFixed(1)}s／${(v3no/35*100).toFixed(0)}%`;
  document.getElementById('v4stat').textContent=`无界面 ${v4no.toFixed(1)}s／${(v4no/DUR*100).toFixed(0)}%（落版另计）`;
  document.getElementById('redline').innerHTML=REDLINE.map(r=>`· ${r}`).join('<br>');
}
function seek(t){T=Math.max(0,Math.min(DUR-0.001,t));render(T);}
let last=performance.now();
function loop(now){const dt=(now-last)/1000;last=now;if(playing){T+=dt*speed;if(T>=DUR){T=DUR-0.001;playing=false;document.getElementById('play').textContent='▶ 播放'}render(T)}requestAnimationFrame(loop)}
document.getElementById('play').onclick=e=>{playing=!playing;if(T>=DUR-0.01)T=0;e.target.textContent=playing?'⏸ 暂停':'▶ 播放'};
document.getElementById('scrub').oninput=e=>{playing=false;document.getElementById('play').textContent='▶ 播放';seek(+e.target.value)};
document.getElementById('prev').onclick=()=>{const s=shotAt(T);const i=SHOTS.indexOf(s);seek(SHOTS[Math.max(0,T-s.s<0.4?i-1:i)].s+0.01)};
document.getElementById('next').onclick=()=>{const i=SHOTS.indexOf(shotAt(T));seek(SHOTS[Math.min(SHOTS.length-1,i+1)].s+0.01)};
document.getElementById('ar').onchange=e=>{ar=e.target.value;film.dataset.ar=ar;render(T)};
document.getElementById('subsBtn').onclick=e=>{subsOn=!subsOn;e.target.classList.toggle('on',subsOn);render(T)};
document.getElementById('slow').onclick=e=>{speed=speed===1?0.5:1;e.target.classList.toggle('on',speed===0.5);e.target.textContent=speed===1?'0.5×':'1×'};
document.getElementById('dump').onclick=()=>{
  const plan={schema:'tygf-film-plan/v4',width:1920,height:1080,fps:30,duration:DUR,
    shots:SHOTS.map(s=>({id:s.id,start:s.s,end:s.e,layout:s.ui?(s.scene==='readback'?'band':'panel'):'centered',
      headline:s.head,headlineEn:s.en,plainExplanation:s.sub,claim:!!s.claim,uiPixels:!!s.ui,exempt:!!s.exempt,
      subtitleCue:s.cue,cueCharsPerSec:+cps(s).toFixed(1),intent:s.intent,source:s.src,
      ...(s.zoom?{zoom:s.zoom}:{}) , ...(s.click?{click:s.click}:{})}))};
  const j=JSON.stringify(plan,null,1);
  document.getElementById('gates').innerHTML=`<li><span class="pill pass">已生成</span> ${SHOTS.length} 镜 / ${DUR}s — 可直接喂给 render.mjs 的 plan.json</li>`+
    `<li style="margin-top:8px"><pre>${j.slice(0,2400)}${j.length>2400?'\n…（完整 JSON 见控制台）':''}</pre></li>`;
  console.log(j);
  try{navigator.clipboard.writeText(j)}catch(e){}
};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();document.getElementById('play').click()}
  if(e.code==='ArrowLeft')seek(T-0.5);if(e.code==='ArrowRight')seek(T+0.5)});
window.seek=seek;
if(/[?&]film=1/.test(location.search)){
  document.body.classList.add('film-mode');
  const q=new URLSearchParams(location.search);
  if(q.get('vert')==='1'){ar='916';film.dataset.ar='916';document.body.classList.add('vert');film.style.font=''}
  playing=false;
}
build();seek(0);requestAnimationFrame(loop);
</script>
