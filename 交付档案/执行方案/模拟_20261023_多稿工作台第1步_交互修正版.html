<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>多稿工作台 · 第 1 步 交互修正版（模拟 2026-10-23）</title>
<style>
  :root{
    --bg:#f6f7f4; --card:#ffffff; --ink:#161a16; --muted:#62685f; --line:#e1e4dc;
    --line2:#eef0e9; --teal:#12694f; --teal-soft:rgba(18,105,79,.12);
    --amber:#a8641a; --amber-soft:rgba(168,100,26,.10);
    --rose:#a63333; --rose-soft:rgba(166,51,51,.09);
    --vio:#6b4ea8;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12140f; --card:#1a1d17; --ink:#eceee7; --muted:#a3a99d; --line:#2c302a;
      --line2:#22261f; --teal:#8fc9ac; --teal-soft:rgba(143,201,172,.14);
      --amber:#e2b07a; --amber-soft:rgba(226,176,122,.12);
      --rose:#e79b96; --rose-soft:rgba(231,155,150,.10); --vio:#b8a3e8;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  .shell{max-width:1180px;margin:0 auto;padding:0 18px 60px}
  /* 顶栏 */
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:-.01em}
  .pill{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
  .rail{display:flex;gap:6px;margin:12px 0 16px;flex-wrap:wrap}
  .rail span{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
  .rail span.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
  /* 通用 */
  .btn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:6px 11px;font-size:12px}
  .btn:hover{background:var(--line2)}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.sm{padding:4px 9px;font-size:11.5px}
  .btn.ghost{color:var(--muted)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;border:1px solid var(--line);
    padding:1px 7px;font-size:10.5px;font-weight:700;white-space:nowrap;color:var(--muted)}
  .tag.ok{color:var(--teal);border-color:rgba(18,105,79,.35);background:var(--teal-soft)}
  .tag.warn{color:var(--amber);border-color:rgba(168,100,26,.35);background:var(--amber-soft)}
  .tag.bad{color:var(--rose);border-color:rgba(166,51,51,.35);background:var(--rose-soft)}
  .tag.info{color:var(--vio);border-color:rgba(107,78,168,.3)}
  .tag.mute{color:var(--muted)}
  .note{border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:5px;
    padding:8px 10px;font-size:12.5px;background:var(--card)}
  .note.warn{border-left-color:var(--amber);background:var(--amber-soft)}
  .note.ok{border-left-color:var(--teal);background:var(--teal-soft)}
  .note.bad{border-left-color:var(--rose);background:var(--rose-soft)}
  .mono{font-family:var(--mono);font-size:11.5px}
  .muted{color:var(--muted)}
  /* 页头 */
  .pghead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:20px;margin:0}
  .sub{font-size:12px;color:var(--muted);margin-top:3px;max-width:760px}
  .tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  /* 文件夹栏 */
  .folderbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);
    background:var(--card);border-radius:9px;padding:9px 11px}
  .folderbar .p{font-family:var(--mono);font-size:12px;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .folderbar .m{flex-basis:100%;font-size:11.5px;color:var(--muted)}
  /* 统计 */
  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
  .stat{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px}
  .stat .v{font-size:24px;font-weight:900;line-height:1;letter-spacing:-.02em}
  .stat .v.teal{color:var(--teal)} .stat .v.warn{color:var(--amber)} .stat .v.bad{color:var(--rose)}
  .stat .l{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.45}
  /* 两栏 */
  .two1{display:grid;grid-template-columns:320px minmax(0,1fr);gap:10px;align-items:start}
  .queue{border:1px solid var(--line);background:var(--card);border-radius:9px;overflow:hidden}
  .qh{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:800}
  .qh .r{margin-left:auto;font-size:11px;font-weight:400;color:var(--muted)}
  .qsec{display:flex;align-items:center;font-size:11px;font-weight:800;color:var(--muted);padding:8px 11px 4px;text-transform:none}
  .qsec .r{margin-left:auto;font-weight:400}
  .qitem{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;background:transparent;
    border:0;border-bottom:1px solid var(--line2);padding:8px 11px}
  .qitem:hover{background:var(--line2)}
  .qitem[aria-current="true"]{background:var(--teal-soft);box-shadow:inset 3px 0 0 var(--teal)}
  .qitem .st{width:16px;height:16px;border-radius:50%;flex:0 0 16px;display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:900;color:#fff;margin-top:2px}
  .qitem.att .st{background:var(--amber)} .qitem.done .st{background:var(--teal)}
  .qitem .bb{min-width:0;flex:1}
  .qitem .n{display:block;font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qitem .m{display:block;font-size:11px;color:var(--muted);margin-top:1px}
  .qitem .tg{margin-left:auto;flex:0 0 auto}
  /* 右面板 */
  .pane{border:1px solid var(--line);background:var(--card);border-radius:9px;min-height:340px;display:flex;flex-direction:column;overflow:hidden}
  .ehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line)}
  .ehead .ttl{font-size:13px;font-weight:800}
  .ehead .r{margin-left:auto;font-size:11px;color:var(--muted)}
  .bd{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
  .pgfoot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-top:1px solid var(--line)}
  .pgfoot .hint{font-size:11.5px;color:var(--muted);flex:1;min-width:180px}
  .ev{display:grid;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .er{display:flex;gap:10px;padding:6px 9px;border-bottom:1px solid var(--line2);font-size:12px}
  .er:last-child{border-bottom:0}
  .er .k{width:96px;flex:0 0 96px;color:var(--muted)}
  .er .v{min-width:0;flex:1}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:7px;padding:9px 10px}
  .opt:hover{background:var(--line2)}
  .opt[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);box-shadow:inset 0 0 0 1px var(--teal)}
  .opt .ol{display:block;font-size:12.5px;font-weight:800}
  .opt .od{display:block;font-size:11px;color:var(--muted);margin-top:2px}
  .drow{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line2);font-size:12px;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
  .drow:hover{background:var(--line2)}
  .drow .kind{flex:0 0 auto;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:10.5px;color:var(--muted)}
  .drow .fn{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .drow .fn .w{display:block;font-size:10.5px;color:var(--muted)}
  .drow .lc{flex:0 0 auto;font-size:11px;color:var(--muted)}
  /* 矩阵 */
  .card{border:1px solid var(--line);background:var(--card);border-radius:9px;overflow:hidden;margin-top:10px}
  .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line)}
  .hd h2{font-size:13px;margin:0}
  .hd .r{margin-left:auto;display:flex;gap:5px}
  .mxwrap{overflow-x:auto}
  table.mx{width:100%;border-collapse:collapse;min-width:720px}
  table.mx th,table.mx td{padding:0;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2)}
  table.mx thead th{font-size:11px;font-weight:800;color:var(--muted);padding:6px 4px;text-align:center;white-space:nowrap;background:var(--card);min-width:36px}
  table.mx thead th:first-child{text-align:left;padding-left:10px;min-width:168px}
  table.mx tbody th{text-align:left;padding:6px 10px;font-weight:700;font-size:12px;white-space:nowrap}
  table.mx tbody th .k{color:var(--muted);font-weight:400;font-size:10.5px;margin-left:4px}
  table.mx td.c{padding:3px}
  .cell{display:block;width:100%;height:22px;border-radius:3px;border:1px solid transparent;background:transparent}
  .c-full{background:var(--teal);border-color:var(--teal);opacity:.88}
  .c-pend{border:1.5px dashed var(--amber);background:var(--amber-soft)}
  .c-miss{border:1.5px solid var(--rose)}
  .c-na{background:var(--line2)}
  .cell:hover{outline:2px solid var(--ink);outline-offset:1px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
  .legend .it{display:inline-flex;align-items:center;gap:5px}
  .legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
  /* 抽屉 */
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,92vw);background:var(--card);
    border-left:1px solid var(--line);box-shadow:-18px 0 40px rgba(0,0,0,.12);transform:translateX(102%);
    transition:transform .18s ease;z-index:40;display:flex;flex-direction:column}
  .drawer.open{transform:none}
  .dhead{padding:12px 14px;border-bottom:1px solid var(--line)}
  .dhead .t{font-size:14px;font-weight:800}
  .dhead .p{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:3px;word-break:break-all}
  .dbody{padding:12px 14px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px}
  .dfoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
  .kv{display:grid;grid-template-columns:78px minmax(0,1fr);gap:6px 8px;font-size:12px}
  .kv dt{color:var(--muted);margin:0} .kv dd{margin:0;word-break:break-all}
  /* 弹窗 */
  .modal{position:fixed;inset:0;background:rgba(10,12,10,.42);z-index:50;display:none;align-items:center;justify-content:center;padding:18px}
  .modal.open{display:flex}
  .mbox{width:min(620px,96vw);max-height:86vh;background:var(--card);border-radius:11px;border:1px solid var(--line);
    display:flex;flex-direction:column;overflow:hidden}
  .mhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .mhead .t{font-weight:800;font-size:14px}
  .mbody{padding:12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
  .mfoot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .pathinput{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-family:var(--mono);font-size:11.5px;background:var(--bg);color:var(--ink)}
  .flist{border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .fitem{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line2);
    padding:7px 10px;text-align:left;font-size:12.5px}
  .fitem:last-child{border-bottom:0}
  .fitem:hover{background:var(--line2)}
  .fitem .nm{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fitem .meta{font-size:10.5px;color:var(--muted);white-space:nowrap}
  /* 提示 */
  .toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center}
  .toast{background:var(--ink);color:var(--bg);border-radius:999px;padding:7px 14px;font-size:12px;box-shadow:0 8px 20px rgba(0,0,0,.18)}
  /* 骨架 */
  .skeleton{opacity:.55}
  .loadbox{border:1px dashed var(--line);border-radius:9px;background:var(--card);padding:22px;text-align:center}
  .loadbox .bar{height:6px;border-radius:3px;background:var(--line2);overflow:hidden;margin:12px auto 0;max-width:360px}
  .loadbox .bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .12s linear}
  @media (max-width:720px){
    .two1{grid-template-columns:1fr}
    .statgrid{grid-template-columns:1fr 1fr}
    .opts{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <span class="brand">图译工坊 · 多稿工作台</span>
    <span class="pill">模拟 · 2026-10-23 · 第 1 步交互修正版</span>

  <main id="root"></main>
</div>

<div id="drawer" class="drawer">

  <div class="dbody" id="db"></div>
  <div class="dfoot" id="df"></div>
</div>

<div id="modal" class="modal">
  <div class="mbox">
    <div class="mhead"><span class="t">选择工作文件夹</span><span class="muted" style="font-size:11.5px">只读 · 不会改动你的文件</span>

    <div class="mfoot" id="mf"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

const S={ folder:ROOT, scanned:true, scanning:false, progress:0, sel1:null,
  drawer:null, picker:null, toastTimer:null, fixOpen:false };

/* ══════════════ 派生 ══════════════ */
function conf(id){ return CONFLICTS.find(c=>c.id===id) }
function c2(){ return conf('C2').chosen }
function active(){ return DRAFTS.filter(d=>!d.paused || c2()==='A') }
function pendingConf(){ return CONFLICTS.filter(c=>!c.chosen).length }
function cellTotal(){ return active().reduce((a,d)=>a+d.langs.length,0) }
function pendingCells(){
  if(conf('C1').chosen) return 0;
  return active().filter(d=>d.sku==='5857'&&d.langs.length).reduce((a,d)=>a+d.langs.length,0);
}
function optName(c,id){ const o=c.opts.find(x=>x.id===id); return o?o.label:'—' }
function langName(c){ const l=LANGS.find(x=>x.c===c); return l?l.zh:c }
function specOf(sku){
  const ds=active().filter(d=>d.sku===sku);
  if(ds.some(d=>!d.langs.length)) return {t:'有稿没表',cls:'bad'};
  if(ds.some(d=>d.tset==='pending')&&!conf('C1').chosen) return {t:'表套待定',cls:'warn'};
  if(ds.some(d=>d.paused)&&!c2()) return {t:'同名副本待定',cls:'warn'};
  return {t:'已归位',cls:'ok'};
}
function step1Items(){
  const it=[];
  CONFLICTS.forEach(c=>it.push({id:'conf:'+c.id,type:'conf',c}));
  [...new Set(active().map(d=>d.sku))].forEach(sku=>it.push({id:'sku:'+sku,type:'sku',sku}));
  it.push({id:'orph',type:'orph'});
  return it;
}
function curSel(){
  const items=step1Items();
  if(!S.sel1||!items.some(i=>i.id===S.sel1)){
    const c=CONFLICTS.find(x=>!x.chosen);
    S.sel1=c?'conf:'+c.id:'conf:'+CONFLICTS[0].id;
  }
  return S.sel1;
}

/* ── 右栏：冲突 ── */
function confEvidence(c){
  const rows=({
    C1:[['摆在面前','同一个 SKU 5857，目录里有两套结构不同的译文表，语言都是 12 种'],
        ['5857\\ 这套','一张一个语言，靠 sheet 分交付物：主图 36 行 / A+ 46 行，单张约 8.4 KB'],
        ['合并版那套','在 完整表-20261003\\ 里：一张一个语言，合并成单 sheet 68 行，没有 sheet 区分，单张约 27.4 KB'],
        ['差别在哪','一种语言的行怎么切给两个交付物，两套切法不一样'],
        ['为什么不能替你选','切错了行数就对不上，整批图要重做——所以停在问你']],
    C2:[['两份都在这','根目录一份、5857\\ 文件夹一份，文件名一模一样'],
        ['根目录那份','MD5 AD4A0B9C…（逐字节比出来的，不是看名字）'],
        ['5857\\ 那份','MD5 A01B7C0C…，和上面不是同一个文件'],
        ['对比过的','6896 那两份 MD5 完全一致 → 那种已经静默合并，不拿来烦你'],
        ['不按什么判断','不按修改时间、不按目录排序，那两条都可能挑错版本']],
    C3:[['这稿','6897 独立站主图.psb（渠道：独立站）'],
        ['同目录有的表','JP 日本-6897.xlsx —— 属于 Amazon A+，36 行'],
        ['为什么先不借','两个渠道的文案位置不一样，借错了字会跑到图外'],
        ['要借也行','右边选"借用"，这稿会一直标着"借用的表"，执行前你能再看一眼']]
  })[c.id]||[];
  return `<div class="ev">${rows.map(([k,v])=>`<div class="er"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>`;
}

  if(d.sku==='5857') return d.tset==='pending'
    ? '文件名里的 5857 → 同 SKU 的 12 张语言表（ES 西班牙 / FR 法国 …）→ 按 sheet 名对到「A+」「主图」两个交付物。两套表结构不同，所以标"待定"。'
    : `文件名里的 5857 → 同 SKU 的 12 张语言表 → 按 sheet 名对到「A+」「主图」。表套已按你选的这套（${d.tset==='B'?'完整表-20261003 合并版':'5857 分 sheet 版'}）走。`;
  if(d.sku==='5294') return '文件名里的 5294 → 同目录那张宽表（文件名写"11 国语言"，表头实际 12 列）→ 表头每个语言名展开成一个格，共用同一份行清单。';
  if(d.sku==='6896') return '文件名里的 6896 → JP 日本-6896.xlsx。另有一份稿和一份表与之逐字节相同，已合并。';
  if(d.sku==='6897') return '文件名里的 6897 → Amazon A+ 稿对上 JP 日本-6897.xlsx；独立站主图没有同渠道的表，所以标"没有自己的表"。';
  if(d.sku==='5477') return '文件名里的 5477 → 同目录 JP 日本-5477.csv（113 行，首行是资源链接行，按表头跳过）。';
  return '文件名里的 6877 → 按"主图 / A+" 分别对上 JP 日本主图 -6877…、JP A+ 6877…';
}

      <div style="padding:10px 12px"><div class="note"><b>凭什么：</b>${basisText(ds[0])}</div></div>
      ${langs?`<div style="padding:0 0 10px">${matrixHtml(ds,'mxsm')}</div>`:''}
      ${langs?`<div class="legend" style="padding:0 12px 10px">点任意格子看它从哪张表的哪个 sheet / 哪一列来</div>`:''}

    <div class="pgfoot">
      <span class="hint">这个 SKU 合计 ${ds.reduce((a,d)=>a+d.langs.length,0)} 个语言格。</span>

function paneOrph(){

/* ── 矩阵 ── */
function matrixHtml(rows,cls){
  rows=rows||active().filter(d=>d.langs.length || true);
  return `<div class="mxwrap ${cls||''}"><table class="mx">
    <thead><tr><th>设计稿</th>${LANGS.map(l=>`<th title="${l.zh}">${l.c}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(d=>`<tr>
      <th><span>${d.sku}</span><span class="k">${d.kind}</span>${d.langs.length===0?'<span class="tag bad" style="margin-left:5px">无表</span>':''}${d.merged?'<span class="tag info" style="margin-left:5px">已合并</span>':''}</th>
      ${LANGS.map(l=>{
        let klass='c-na',title='这稿只做 '+d.langs.length+' 种语言，不涉及';
        if(d.langs.length===0){ klass='c-miss'; title=d.sku+'：没有同渠道的表'; }
        else if(d.langs.includes(l.c)){
          if(d.tset==='pending'&&!conf('C1').chosen){ klass='c-pend'; title=l.zh+'：表套待你定'; }
          else { klass='c-full'; title=l.zh+'：已配到位'; }
        }
        return `<td class="c"><button class="cell ${klass}" title="${title}" aria-label="${d.sku} ${d.kind} ${l.zh}" onclick="openCell('${d.id}','${l.c}')"></button></td>`;
      }).join('')}
    </tr>`).join('')}</tbody></table></div>`;
}

/* ── 拍板：选一个 → 自动跳下一件 ── */
function pickConflict(cid,oid){
  const c=conf(cid); c.chosen=oid;
  if(cid==='C1'){ DRAFTS.forEach(d=>{ if(d.sku==='5857') d.tset=oid; }); }
  if(cid==='C2'){ DRAFTS.forEach(d=>{ if(d.sku==='5857'&&d.paused) d.paused=(oid!=='A'); }); }
  if(cid==='C3'&&oid==='B'){ const d=DRAFTS.find(x=>x.id==='g6897'); d.langs=['JP']; d.table='JP 日本-6897.xlsx（借用）'; d.borrowed=true; }
  if(cid==='C3'&&oid==='A'){ const d=DRAFTS.find(x=>x.id==='g6897'); d.langs=[]; d.table=null; d.borrowed=false; }
  const msg={
    C1:'表套已定：5857 的 24 个语言格按你选的这套走',
    C2:oid==='A'?'两份同名稿都留下：本批 11 稿 65 格':'只留根目录那份：5857 文件夹里的同名牌不再做',
    C3:oid==='B'?'已借用 Amazon 的 JP 表，这稿会一直标着"借用的表"':'这稿先跳过，留在列表里标"无表"'
  }[cid];
  const next=CONFLICTS.find(x=>!x.chosen);
  S.sel1=next?'conf:'+next.id:'conf:'+cid;
  toast(msg+(next?`　下一件：${next.short}`:'　三件都定完了'));
  render();
}

/* ── 抽屉 ── */
function openCell(did,lc){
  const d=DRAFTS.find(x=>x.id===did);
  S.drawer={kind:'cell',did,lc};
  const t=document.getElementById('dt'),p=document.getElementById('dp'),b=document.getElementById('db'),f=document.getElementById('df');
  t.textContent=`${d.sku} · ${d.kind}`; p.textContent=d.file;
  if(!d.langs.length){
    b.innerHTML=`<div class="note bad"><b>这稿没有表。</b><br>${d.sku} 在同目录只有一张 JP 日本-6897.xlsx，它是 Amazon A+ 的表；独立站主图和它位置不一样，所以没有自动借用。</div>
      <div class="kv"><dt>要不要借</dt><dd>第一步的冲突卡里可以显式勾"借用 Amazon 的 JP 表"。</dd></div>`;
  }else{
    const lang=lc||d.langs[0];
    const is5857=d.sku==='5857';
    const file=is5857?((d.tset==='B'?'完整表-20261003\\':'5857\\')+`${lang} ${langName(lang)}-5857.xlsx`)
      :(d.wide?d.table:(d.table||`${lang} ${langName(lang)}-${d.sku}.xlsx`));
    const sheet=is5857?(d.tset==='B'?'Sheet1':(d.sheet||'主图')):(d.wide?'Sheet1':(d.sheet||'主图'));
    const col=d.wide?`第 ${LANGS.findIndex(x=>x.c===lang)+1} 列（${langName(lang)}）`:'第 2 列（译文）';
    b.innerHTML=`<div class="kv">
        <dt>语言</dt><dd>${lang} ${langName(lang)}</dd>
        <dt>文件</dt><dd class="mono">${file}</dd>
        <dt>sheet</dt><dd class="mono">${sheet}</dd>
        <dt>列</dt><dd>${col}</dd>
        <dt>行</dt><dd class="mono">2 – ${d.rows||'—'}</dd>
        ${d.borrowed?'<dt>借用</dt><dd>这张表原本属于 Amazon A+，借用后一直有标记</dd>':''}
      </div>
      <div class="note ok"><b>凭什么这么配：</b>${basisText(d)}</div>
      ${d.tset==='pending'&&!conf('C1').chosen?'<div class="note warn">表套还没定：这一格先按你选的那套算，选之前数字只是参考。</div>':''}
      <div class="note"><b>另一个版本：</b>${d.sku==='5857'?'完整表-20261003 里那张是合并版（单 sheet 68 行），和这里的结构不一样。':'这个 SKU 没有发现第二个版本。'}</div>`;
  }
  f.innerHTML=`<button class="btn" onclick="toast('已在资源管理器中定位')">在文件夹里看</button><button class="btn primary" style="margin-left:auto" onclick="closeDrawer()">好</button>`;
  document.getElementById('drawer').classList.add('open');
}

function openRule(){
  S.drawer={kind:'rule'};
  document.getElementById('dt').textContent='归属规则';
  document.getElementById('dp').textContent='每一格都能追到文件 + sheet + 列 + 行';
  document.getElementById('db').innerHTML=`
    <div class="note">一格 = <b>SKU × 交付物 × 语言</b>。SKU 从文件名的 4 位数字认（跳过 20251211、11.11 这类）；交付物认 A+ / 主图 / 主副图 / 详情页；语言先看文件名前缀，再看宽表表头，最后看 sheet 名。</div>
    <div class="note">① 同 SKU＋同交付物＋同语言的唯一候选 → 自动配。<br>② 同 SKU＋同语言、靠 sheet 分交付物 → 自动配到对应 sheet。<br>③ 目录只当加分项，不当门槛。<br>④ 定不了 → 冲突卡，一键二选一，默认不选。</div>
    <div class="note ok">MD5 相同 = 内容一样 → 静默合并，只报一句"3 份重复已合并"。</div>
    <div class="note bad">MD5 不同 = 内容不同 → 一定问你。绝不按修改时间、目录排序替你挑。</div>`;
  document.getElementById('df').innerHTML=`<button class="btn" style="margin-left:auto" onclick="closeDrawer()">知道了</button>`;
  document.getElementById('drawer').classList.add('open');
}

function openFixes(){
  document.getElementById('dt').textContent='这次改了什么';
  document.getElementById('dp').textContent='7 条：从"新壳是旧流程的前置装饰"改成"第 1 步自己就是全部"';
  document.getElementById('db').innerHTML=`
    <div class="note bad"><b>① 选完文件夹就是本批</b><br>现在：还要多点一次"把 12 个稿加入本批"，点之前四个统计全是 0。<br>改成：选完文件夹直接就是本批——就像你现在看到的这份模拟。</div>
    <div class="note bad"><b>② 第 1 步就把表头读掉</b><br>现在：语言矩阵写着"表还没读"，因为语言要等导入才解析。<br>改成：选完文件夹后台读 51 张表的表头（只读前几行），1–2 秒后 12 列就位。这是唯一需要助手再发一版的地方。</div>
    <div class="note bad"><b>③ 矩阵是"每份稿 × 每种语言"</b><br>现在：一行是一个 SKU，格子里是"几份稿"，还多一列"缺表"。<br>改成：一行是一份稿，12 格对应 12 种语言，四态：有表 / 表套待定 / 缺表 / 不涉及。</div>
    <div class="note bad"><b>④ 格子能点开来源</b><br>现在：格子是死的。<br>改成：点任何一格，右边抽屉写清"哪张表、哪个 sheet、第几列、第 2–N 行、为什么这么配、另一个版本是什么"。</div>
    <div class="note bad"><b>⑤ 终点不再是旧弹窗</b><br>现在：点"读表并导入"会弹回旧的批量导入确认框，新壳变成旧流程的过场。<br>改成：底部就是"下一步 · 逐稿校对 →"，读表在下一步自动做掉；旧弹窗只保留在"逐稿手动导入…"这个显式入口里。</div>
    <div class="note bad"><b>⑥ 按 SKU 看，右栏有它自己的小矩阵</b><br>现在：右栏只有几行字，逐稿行点不开。<br>改成：逐稿行可点开来源，右栏带这个 SKU 的 12 列小矩阵。</div>
    <div class="note bad"><b>⑦ 拍板手感与统计口径</b><br>现在：冲突项写文件名；选完只静静换选中项。<br>改成：写"牵着 N 份稿"，选完弹一句话并自动跳下一件；统计口径与参考稿一致（同名副本待定 / 其中 N 格等表套确定 / 文件夹数 / 跳过项）。</div>
    <div class="note warn"><b>还没做到的（如实）</b><br>这台模拟里的数据是 2026-10-22 的真实目录快照；真站上要等第 ② 条（助手 3.7.25 读表头）落地，才能做到"选完文件夹就有 12 列"。</div>`;
  document.getElementById('df').innerHTML=`<button class="btn primary" style="margin-left:auto" onclick="closeDrawer()">开始点</button>`;
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  S.drawer=null;
}

/* ── 选文件夹 ── */
function openPicker(){
  S.picker={path:S.folder};
  document.getElementById('modal').classList.add('open');
  renderModal();
}
function closePicker(){ document.getElementById('modal').classList.remove('open'); S.picker=null; }

function renderModal(){
  if(!S.picker) return;
  const path=S.picker.path;
  const entries=(FS[path]||[]).map(([name,d,t])=>({name,d,t}));
  document.getElementById('mb').innerHTML=`
    <input class="pathinput" value="${path}" onchange="S.picker.path=this.value;renderModal()" aria-label="文件夹路径" />
    <div class="note" style="font-size:11.5px">这一层 ${entries.length} 个文件夹。点进去是单层浏览，不会展开整棵树，也不会读文件内容（读表头是另一件事，只读前几行）。</div>
    <div class="flist">${entries.map(e=>`<button class="fitem" onclick="S.picker.path='${path}\\\\${e.name}';renderModal()">
      <span>📁</span><span class="nm">${e.name}</span>
      <span class="meta">${e.d?'稿 '+e.d+' · ':''}表 ${e.t}</span></button>`).join('')}
    </div>`;
  document.getElementById('mf').innerHTML=`
    <button class="btn" onclick="S.picker.path='${ROOT}';renderModal()">回到工作目录</button>
    <button class="btn" style="margin-left:auto" onclick="closePicker()">取消</button>
    <button class="btn primary" onclick="confirmFolder()">用这个文件夹</button>`;
}

function confirmFolder(){
  const path=S.picker.path;
  closePicker();
  S.scanning=true; S.progress=0; render();
  const timer=setInterval(()=>{
    S.progress=Math.min(100,S.progress+7);
    render();
    if(S.progress>=100){
      clearInterval(timer);
      S.scanning=false; S.folder=path; S.scanned=true;
      render();
      toast('已切换文件夹：'+path+'　12 个设计文件、51 张表，用时 1.4 秒（只读，不会动你的文件）');
    }
  },70);
}

/* ── 其它 ── */
function rescan(){ toast('重新扫描：12 个设计文件、51 张译文表，用时 1.4 秒（已定的选择不会丢）'); }
function goNext(){ toast('进第 2 步：这里会自动读表并带 '+active().length+' 稿 / '+cellTotal()+' 格过去，不再弹回旧确认框'); }
function scrollMatrix(){ document.getElementById('matrixFull').scrollIntoView({behavior:'smooth',block:'start'}); }
function toast(msg){
  const box=document.getElementById('toasts');
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  box.appendChild(el);
  setTimeout(()=>el.remove(),4200);
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDrawer(); closePicker(); } });
render();
</script>
</body>
</html>
