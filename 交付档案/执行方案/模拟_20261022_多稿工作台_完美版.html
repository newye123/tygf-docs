<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>多稿工作台 · 完美版模拟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f7f7f5;--surface:#fff;--sunk:#f4f4f1;--sunk2:#ededE8;--ink:#121412;--ink2:#3c443f;
  --muted:#6c756f;--faint:#9aa19b;--line:#e6e6e2;--line2:#d4d4ce;
  --teal:#009588;--teal7:#00776d;--tealSoft:#e3f4f2;--tealLine:#b9e0db;
  --em:#009767;--emSoft:#e4f6ef;--emLine:#b7e3d1;
  --amber:#8a5a00;--amberSoft:#fff6e4;--amberLine:#edd39a;
  --rose:#b3261e;--roseSoft:#fceceb;--roseLine:#f0c6c3;
  --vio:#6b3fa0;--vioSoft:#f2ecfa;--vioLine:#dbc9f1;
  --r:14px;--r2:10px;--r3:8px;
  --f:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --m:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --sh1:0 1px 2px rgba(18,20,18,.05);--sh2:0 10px 30px -14px rgba(18,20,18,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:13.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.mono{font-family:var(--m)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d7d7d1;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ─ 顶栏 ─ */
.top{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px}
.brand .mk{width:25px;height:25px;border-radius:8px;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.crumb{color:var(--faint);font-size:12.5px}
.top .fchip{margin-left:6px;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:5px 12px 5px 10px;background:var(--sunk);max-width:min(46vw,560px)}
.top .fchip .p{font-family:var(--m);font-size:11.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .fchip .dot{width:6px;height:6px;border-radius:50%;background:var(--em);flex:none}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.pill{border:1px solid var(--line2);border-radius:999px;padding:3px 9px;font-size:11.5px;display:flex;align-items:center;gap:6px;background:var(--surface)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--em)}
.ava{width:26px;height:26px;border-radius:50%;background:var(--sunk2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink2)}

/* ─ 骨架 ─ */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 54px)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px;display:flex;flex-direction:column;gap:3px}
.rail .hd{font-size:10.5px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;padding:0 8px 6px}
.step{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border-radius:10px;text-align:left;width:100%;transition:.14s}
.step:hover{background:var(--sunk)}
.step[aria-current="true"]{background:var(--tealSoft)}
.step .n{width:19px;height:19px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:10.5px;color:var(--muted);flex:none;margin-top:2px}
.step[aria-current="true"] .n{background:var(--teal);border-color:var(--teal);color:#fff}
.step.done .n{background:var(--em);border-color:var(--em);color:#fff}
.step .t{display:block;font-size:12.8px;font-weight:600;line-height:1.35}
.step .s{display:block;font-size:11px;color:var(--muted);line-height:1.4;margin-top:1px;font-variant-numeric:tabular-nums}
.step .s b{color:var(--ink2);font-weight:600}
.rail .foot{margin-top:auto;padding:10px 8px 2px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.6}
.rail .foot .k{color:var(--faint)}

.main{padding:16px 18px 80px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:1024px){ .main{padding-right:76px} }
.pghead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.pghead h1{margin:0;font-size:18.5px;font-weight:700;letter-spacing:-.01em}
.pghead .sub{font-size:12.5px;color:var(--muted);margin-top:2px;max-width:76ch}
.pghead .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:600;transition:.14s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink2);background:var(--sunk)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal7);border-color:var(--teal7)}
.btn.ghost{border-style:dashed;color:var(--muted);background:transparent}
.btn.sm{padding:3px 8px;font-size:11.5px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--line2);background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.card>.hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>.hd h2{margin:0;font-size:13px;font-weight:700}
.card>.hd .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card>.bd{padding:12px 14px}
.tag{font-family:var(--m);font-size:10.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag.ok{background:var(--emSoft);border-color:var(--emLine);color:#0a5a41}
.tag.warn{background:var(--amberSoft);border-color:var(--amberLine);color:var(--amber)}
.tag.bad{background:var(--roseSoft);border-color:var(--roseLine);color:var(--rose)}
.tag.info{background:var(--tealSoft);border-color:var(--tealLine);color:var(--teal7)}
.tag.vio{background:var(--vioSoft);border-color:var(--vioLine);color:var(--vio)}
.tag.mute{background:var(--sunk2);border-color:var(--line);color:var(--muted)}

/* 文件夹条 */
.folderbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 13px;box-shadow:var(--sh1);flex-wrap:wrap}
.folderbar .ic{width:28px;height:28px;border-radius:8px;background:var(--tealSoft);color:var(--teal7);display:grid;place-items:center;font-size:14px;flex:none}
.folderbar .p{font-family:var(--m);font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:58vw}
.folderbar .m{font-size:11.5px;color:var(--muted);width:100%;padding-left:38px;margin-top:-4px}
.folderbar .r{margin-left:auto;display:flex;gap:6px}

/* 数字 */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;box-shadow:var(--sh1)}
.stat .v{font-family:var(--m);font-size:20px;font-weight:500;line-height:1.2}
.stat .l{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.45}
.stat .v.ok{color:var(--em)}.stat .v.warn{color:var(--amber)}.stat .v.bad{color:var(--rose)}.stat .v.teal{color:var(--teal7)}

/* 归属说明 */
.rulebar{display:flex;align-items:flex-start;gap:10px;background:var(--tealSoft);border:1px solid var(--tealLine);border-radius:var(--r2);padding:10px 12px;font-size:12.3px;color:#155e57;line-height:1.6}
.rulebar b{font-weight:700}
.rulebar .x{margin-left:auto;flex:none}

/* 组卡 */
.groups{display:flex;flex-direction:column;gap:9px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);overflow:hidden}
.gcard.attn{border-color:var(--amberLine);box-shadow:0 0 0 3px #fff7e8}
.ghead{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#fcfcfb)}
.sku{font-family:var(--m);font-size:14px;font-weight:500;letter-spacing:.02em;background:var(--ink);color:#fff;border-radius:7px;padding:2px 8px}
.ghead .gt{font-size:12.8px;font-weight:600}
.ghead .gs{font-size:11.5px;color:var(--muted)}
.ghead .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.gbody{padding:6px 8px 8px;display:flex;flex-direction:column;gap:2px}
.drow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:7px 7px;border-radius:9px}
.drow:hover{background:var(--sunk)}
.drow .kind{font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--sunk2);border-radius:6px;padding:1px 7px;white-space:nowrap}
.drow .fn{font-family:var(--m);font-size:11.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .fn .w{font-family:var(--f);font-size:10.5px;color:var(--faint);margin-left:6px}
.drow .lc{font-family:var(--m);font-size:11.5px;color:var(--ink2);white-space:nowrap}
.drow .st{display:flex;gap:5px;align-items:center;justify-content:flex-end;white-space:nowrap}
.gfoot{padding:0 13px 10px;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;line-height:1.55}
.gfoot .b{color:var(--ink2);font-weight:600}

/* 冲突卡 */
.conflict{border:1px solid var(--amberLine);background:var(--amberSoft);border-radius:var(--r);padding:12px 13px;display:flex;flex-direction:column;gap:9px}
.conflict.done{border-color:var(--emLine);background:var(--emSoft)}
.conflict .ct{font-size:12.8px;font-weight:700;color:#6d4700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.conflict.done .ct{color:#0a5a41}
.conflict .cd{font-size:12px;color:#5b4a22;line-height:1.6}
.conflict.done .cd{color:#0a5a41}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.opt{text-align:left;border:1px solid var(--amberLine);background:var(--surface);border-radius:var(--r2);padding:9px 11px;display:flex;flex-direction:column;gap:3px;transition:.14s}
.opt:hover{border-color:var(--amber);box-shadow:var(--sh1)}
.opt[aria-pressed="true"]{border-color:var(--em);box-shadow:0 0 0 3px var(--emSoft)}
.opt .ol{font-size:12.3px;font-weight:700}
.opt .od{font-size:11.5px;color:var(--muted);line-height:1.5}
.opt .om{font-family:var(--m);font-size:10.5px;color:var(--faint)}

/* 矩阵 */
.mxwrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh1)}
table.mx{border-collapse:separate;border-spacing:0;width:100%;font-size:11.5px}
table.mx th,table.mx td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.mx thead th{position:sticky;top:0;z-index:3;background:var(--sunk);font-family:var(--m);font-size:10.5px;font-weight:500;color:var(--ink2);padding:6px 2px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line2)}
table.mx thead th:first-child{left:0;z-index:5;text-align:left;padding-left:12px;min-width:232px;background:var(--sunk)}
table.mx tbody th{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:6px 12px;font-weight:500;min-width:232px;box-shadow:1px 0 0 var(--line)}
table.mx tbody th .d{font-family:var(--m);font-size:11px}
table.mx tbody th .k{font-size:10.5px;color:var(--muted);margin-left:5px}
table.mx tbody tr:hover th,table.mx tbody tr:hover td{background:#f7fbfa}
.cell{width:100%;min-height:34px;display:grid;place-items:center;transition:.1s;position:relative}
.cell:hover{filter:brightness(.96)}
.cell .g{width:13px;height:13px;border-radius:4px}
.c-full{background:var(--tealSoft)}.c-full .g{background:var(--teal)}
.c-pend{background:var(--amberSoft)}.c-pend .g{background:transparent;border:1.5px dashed var(--amber)}
.c-miss{background:var(--roseSoft)}.c-miss .g{background:transparent;border:1.5px solid var(--rose)}
.c-na{background:#fbfbfa}.c-na .g{background:var(--line2);opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:11.5px;color:var(--muted);padding:9px 14px 0}
.legend .it{display:flex;align-items:center;gap:5px}
.legend .g{width:11px;height:11px;border-radius:3px}

/* 有表无稿 */
.orphans .hd{cursor:pointer}
.orphlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;padding:10px 14px 12px}
.orph{font-family:var(--m);font-size:11px;color:var(--ink2);background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:5px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 第2步 */
.two{display:grid;grid-template-columns:266px minmax(0,1fr);gap:12px;align-items:start}.queue{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);overflow:hidden}
.queue .qh{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.queue .qh .r{margin-left:auto;font-family:var(--m);font-size:11px;color:var(--muted);font-weight:400}
.qitem{display:flex;gap:7px;align-items:center;padding:7px 11px;width:100%;text-align:left;border-left:2px solid transparent}
.qitem:hover{background:var(--sunk)}
.qitem[aria-current="true"]{background:var(--tealSoft);border-left-color:var(--teal)}
.qitem .st{width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:9px;flex:none;color:transparent}
.qitem.done .st{background:var(--em);border-color:var(--em);color:#fff}
.qitem.na .st{border-style:dashed;background:transparent}
.qitem .bb{min-width:0;flex:1}
.qitem .n{font-family:var(--m);font-size:11.5px;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qitem .m{font-size:10.5px;color:var(--muted);display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.editor{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);overflow:hidden}
.ehead{padding:10px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ehead .ttl{font-size:13px;font-weight:700}
.ehead .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.ltabs{display:flex;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:#fcfcfb}
.ltab{border:1px solid var(--line2);border-radius:999px;padding:2px 9px;font-size:11.5px;font-family:var(--m);color:var(--ink2);background:var(--surface)}
.ltab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
table.rows{width:100%;border-collapse:collapse;font-size:12px}
table.rows th{text-align:left;font-size:10.5px;font-weight:500;color:var(--muted);background:var(--sunk);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rows td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.rows td.n{font-family:var(--m);font-size:10.5px;color:var(--faint);width:34px}
table.rows td.src{color:var(--ink2);max-width:34ch}
table.rows td.dst{color:var(--ink)}
table.rows tr:last-child td{border-bottom:none}
.efoot{padding:9px 13px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;background:#fcfcfb;flex-wrap:wrap}
.efoot .hint{font-size:11.5px;color:var(--muted);margin-right:auto}

/* 第1步 · 左右两栏 */
.two1{display:grid;grid-template-columns:296px minmax(0,1fr);gap:12px;align-items:start}
.two1 .queue{max-height:min(72vh,720px);overflow:auto}
.qsec{display:flex;align-items:center;gap:6px;padding:7px 11px 5px;font-size:10.5px;letter-spacing:.1em;color:var(--faint);background:var(--sunk);border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.qsec:first-child{border-top:0}
.qsec .r{margin-left:auto;font-family:var(--m);letter-spacing:0;color:var(--muted);font-weight:400}
.qitem .tg{margin-left:auto;display:flex;gap:3px;flex:none}
.qitem.att .st{border-color:var(--amberLine);background:var(--amberSoft);color:var(--amber);font-weight:700}
.qitem.orph .st{border-style:dashed}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);overflow:hidden}
.pane .bd{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.ev{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.ev .er{display:grid;grid-template-columns:108px minmax(0,1fr);gap:10px;font-size:12.2px;padding:8px 12px;border-bottom:1px solid var(--line)}
.ev .er:last-child{border-bottom:none}
.ev .er:nth-child(odd){background:#fcfcfb}
.ev .k{color:var(--muted);font-size:11.5px}
.ev .v{word-break:break-word;line-height:1.55}
.pgfoot{display:flex;align-items:center;gap:8px;padding:9px 13px;border-top:1px solid var(--line);background:#fcfcfb;flex-wrap:wrap}
.pgfoot .hint{font-size:11.5px;color:var(--muted);margin-right:auto;line-height:1.5}
.mxsm table.mx thead th:first-child,.mxsm table.mx tbody th{min-width:150px}
.mxsm .cell{min-height:28px}
@media (max-width:1239px){.two1{grid-template-columns:1fr}.two1 .queue{max-height:none}}

/* 第3步 */
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{padding:4px 13px;border-radius:7px;font-size:12.3px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}
.barlist{display:flex;flex-direction:column}
.barrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(90px,1fr) 62px;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.barrow:last-child{border-bottom:none}
.barrow .nm{font-size:12.3px;display:flex;gap:7px;align-items:center;min-width:0}
.barrow .nm .f{font-family:var(--m);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:6px;border-radius:99px;background:var(--sunk2);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--teal)}
.fill.done{background:var(--em)}
.barrow .num{font-family:var(--m);font-size:11.5px;color:var(--ink2);text-align:right}
.gate{display:flex;align-items:flex-start;gap:9px;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;font-size:12.3px;color:var(--ink2);line-height:1.6}
.gate.ok{background:var(--emSoft);border-color:var(--emLine);color:#0a5a41}
.gate .g{font-size:14px;flex:none}

/* 第4步 */
table.ex{width:100%;border-collapse:collapse;font-size:12px}
table.ex th{text-align:left;font-size:10.5px;font-weight:500;color:var(--muted);background:var(--sunk);padding:7px 11px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ex td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ex tr:last-child td{border-bottom:none}
table.ex td.f{font-family:var(--m);font-size:11.5px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.ex td.n{font-family:var(--m);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.note.warn{background:var(--amberSoft);border-color:var(--amberLine);color:#6d4700}
.note.bad{background:var(--roseSoft);border-color:var(--roseLine);color:#8c1e17}
.note.ok{background:var(--emSoft);border-color:var(--emLine);color:#0a5a41}

/* 悬浮球 */
.ball{position:fixed;right:16px;top:50%;transform:translateY(-50%);z-index:45;width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;box-shadow:var(--sh2);display:grid;place-items:center;font-weight:800;font-size:14px;transition:.16s}
.ball:hover{background:var(--teal7);transform:translateY(-50%) scale(1.05)}
.ball .tip{position:absolute;right:52px;top:50%;transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11.5px;font-weight:500;padding:4px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:.14s}
.ball:hover .tip{opacity:1}
.ball[data-off="1"]{background:var(--sunk2);color:var(--faint);border:1px dashed var(--line2);box-shadow:none}
.toptypo{display:none;width:28px;height:28px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);place-items:center;font-weight:800;font-size:12px;color:var(--ink2)}
@media (max-width:1023px){
  .shell{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}
  .rail .hd,.rail .foot{display:none}
  .step{width:auto;flex:none}
  .two{grid-template-columns:1fr}
  .ball{display:none}
  .toptypo{display:grid!important}
}

.drawer{position:fixed;top:54px;right:0;bottom:0;width:min(420px,92vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--sh2);z-index:60;display:flex;flex-direction:column;transform:translateX(101%);transition:transform .22s cubic-bezier(.4,0,.2,1)}

  if(d.table) return d.table;

function step1Items(){
  const it=[];
  CONFLICTS.forEach(c=>it.push({id:'conf:'+c.id,type:'conf',c}));
  [...new Set(active().map(d=>d.sku))].forEach(sku=>it.push({id:'sku:'+sku,type:'sku',sku}));
  it.push({id:'orph',type:'orph'});
  return it;
}
function curSel1(){
  const items=step1Items();
  if(!S.sel1||!items.some(i=>i.id===S.sel1)){
    const c=CONFLICTS.find(x=>!x.chosen);
    S.sel1=c?'conf:'+c.id:'conf:'+CONFLICTS[0].id;
  }
  return S.sel1;
}
function optName(c,id){const o=c.opts.find(x=>x.id===id);return o?o.label:'—'}
function specOf(sku){
  const ds=active().filter(d=>d.sku===sku);
  if(ds.some(d=>!d.langs.length))return{t:'有稿没表',cls:'bad'};
  if(ds.some(d=>d.tset==='pending')&&!CONFLICTS[0].chosen)return{t:'表套待定',cls:'warn'};
  if(ds.some(d=>d.paused)&&!CONFLICTS[1].chosen)return{t:'同名副本待定',cls:'warn'};
  return{t:'已归位',cls:'ok'};
}
function confEvidence(c){
  const rows=({
    C1:[['摆在面前','同一个 SKU 5857，目录里有两套结构不同的译文表，语言都是 12 种'],
        ['5857\\ 这套','一张一个语言，靠 sheet 分交付物：主图 36 行 / A+ 46 行，单张约 8.4 KB'],
        ['合并版那套','在 完整表-20261003\\ 里：一张一个语言，合并成单 sheet 68 行，没有 sheet 区分，单张约 27.4 KB'],
        ['差别在哪','一种语言的行怎么切给两个交付物，两套切法不一样'],
        ['为什么不能替你选','切错了行数就对不上，整批图要重做——所以停在问你']],
    C2:[['两份都在这','根目录一份、5857\\ 文件夹一份，文件名一模一样'],
        ['根目录那份','MD5 AD4A0B9C…（逐字节比出来的，不是看名字）'],
        ['5857\\ 那份','MD5 A01B7C0C…，和上面不是同一个文件'],
        ['对比过的','6896 那两份 MD5 完全一致 → 那种已经静默合并，不拿来烦你'],
        ['不按什么判断','不按修改时间、不按目录排序，那两条都可能挑错版本']],
    C3:[['这稿','6897 独立站主图.psb（渠道：独立站）'],
        ['同目录有的表','JP 日本-6897.xlsx —— 属于 Amazon A+，36 行'],
        ['为什么先不借','两个渠道的文案位置不一样，借错了字会跑到图外'],
        ['要借也行','右边选"借用"，这稿会一直标着"借用的表"，执行前你能再看一眼']]
  })[c.id]||[];
  return `<div class="ev">${rows.map(([k,v])=>`<div class="er"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('')}</div>`;
}

function basisText(d){
  if(d.sku==='5857') return d.tset==='pending'
    ? '文件名里的 5857 → 同 SKU 的 12 张语言表（ES 西班牙 / FR 法国 …）→ 按 sheet 名对到「A+」「主图」两个交付物。两套表结构不同，所以标"待定"。'
    : `文件名里的 5857 → 同 SKU 的 12 张语言表 → 按 sheet 名对到「A+」「主图」。表套已按你选的这套（${d.tset==='B'?'完整表-20261003 合并版':'5857 分 sheet 版'}）走。`;
  if(d.sku==='5294') return '文件名里的 5294 → 同目录那张宽表（文件名写"11 国语言"，表头实际 12 列）→ 表头每个语言名展开成一个格，共用同一份行清单。';
  if(d.sku==='6896') return '文件名里的 6896 → JP 日本-6896.xlsx。另有一份稿和一份表与之逐字节相同，已合并。';
  if(d.sku==='6897') return '文件名里的 6897 → Amazon A+ 稿对上 JP 日本-6897.xlsx；独立站主图没有同渠道的表，所以标"没有自己的表"。';
  if(d.sku==='5477') return '文件名里的 5477 → 同目录 JP 日本-5477.csv（113 行，首行是资源链接行，按表头跳过）。';
  return '文件名里的 6877 → 按"主图 / A+" 分别对上 JP 日本主图 -6877…、JP A+ 6877…';
}

function ballClick(){
  if(S.assistantOff){toast('助手 3.7.22 这次没回报排版能力。功能没消失，只是现在用不了 —— 点这里可以诊断或升级，升级完球就恢复。');return}
  openDrawer('typo');

function goStep(n){S.step=n;S.drawer=null;render();window.scrollTo({top:0,behavior:'smooth'})}

function pickConflict(cid,oid){
  const c=CONFLICTS.find(x=>x.id===cid);c.chosen=oid;
  if(cid==='C1'){
    // 表套定了：5857 的四份稿（含同名副本）都按这套走
    DRAFTS.forEach(d=>{if(d.sku==='5857')d.tset=oid});
  }
  if(cid==='C2'){
    // A = 两份都做（放开 5857 文件夹里的同名副本）；B = 只留根目录那份（保持排除）
    DRAFTS.forEach(d=>{if(d.sku==='5857'&&d.paused){d.paused=(oid!=='A')}});
  }
  const msg={
    C1:'表套已定：5857 的 24 个语言格按你选的这套走',
    C2:oid==='A'?'两份同名稿都留下：本批 11 稿 65 格':'只留根目录那份：5857 文件夹里的同名牌不再做',
    C3:oid==='B'?'已借用 Amazon 的 JP 表，这稿会一直标着"借用的表"':'这稿先跳过，留在列表里标"无表"'
  }[cid];
  const next=CONFLICTS.find(x=>!x.chosen);
  S.sel1=next?'conf:'+next.id:'conf:'+cid;
  toast(msg+(next?`　下一件：${next.short}`:'　三件都定完了'));
  S.cur2=null;S.cur3=null;render();
}

function confirmDraft(id){
  const d=DRAFTS.find(x=>x.id===id);S.confirmed[id]=true;
  const next=needReview().find(x=>!S.confirmed[x.id]);
  if(next){S.cur2=next.id;toast(`${d.sku} ${d.kind} 已确认（${d.langs.length} 格），下一稿：${next.sku} ${next.kind}`)}
  else{S.cur2=id;toast('本批全部确认完了，可以去总览一键通过')}
  render();
}

function askExecute(){
  const rows=active().filter(d=>d.langs.length);
  S.modal={type:'exec',rows};
  render();
}

    b.innerHTML=`
      <div class="fld"><div class="lb">三轴</div>
        <div class="note">一格 = <b>SKU × 交付物 × 语言</b>。SKU 从文件名的 4 位数字认（跳过 20251211、11.11 这类）；交付物认 A+ / 主图 / 主副图 / 详情页；语言先看文件名前缀，再看宽表表头，最后看 sheet 名。</div></div>
      <div class="fld"><div class="lb">优先级</div>
        <div class="note">① 同 SKU＋同交付物＋同语言的唯一候选 → 自动配。<br>② 同 SKU＋同语言、靠 sheet 分交付物 → 自动配到对应 sheet。<br>③ 目录只当加分项，不当门槛。<br>④ 定不了 → 冲突卡，一键二选一，默认不选。</div></div>
      <div class="fld"><div class="lb">两种合并</div>
        <div class="note ok">MD5 相同 = 内容一样 → 静默合并，只报一句"3 份重复已合并"。</div>
        <div class="note bad">MD5 不同 = 内容不同 → 一定问你。绝不按修改时间、目录排序替你挑。</div></div>`;
    f.innerHTML=`<button class="btn" style="margin-left:auto" onclick="closeDrawer()">知道了</button>`;
    return;
  }
  if(S.drawer.kind==='cell'){
    const {did,langCode}=S.drawer.payload;const d=DRAFTS.find(x=>x.id===did);
    t.textContent=`${d.sku} · ${d.kind}`;p.textContent=d.file;
    if(!d.langs.length){
      b.innerHTML=`<div class="note bad"><b>这稿没有表。</b><br>${d.sku} 在同目录只有一张 JP 日本-6897.xlsx，它是 Amazon A+ 的表；独立站主图和它位置不一样，所以没有自动借用。</div>
      <div class="kv"><dt>要不要借</dt><dd>第一步的冲突卡里可以显式勾"借用 Amazon 的 JP 表"。</dd></div>`;
    }else{
      const lc=langCode||d.langs[0];
      const is5857=d.sku==='5857';
      const file=is5857?((d.tset==='B'?'完整表-20261003\\':'5857\\')+`${lc} ${langName(lc)}-5857.xlsx`)
        :(d.wide?d.table:(d.table||`${lc} ${langName(lc)}-${d.sku}.xlsx`));
      const sheet=is5857?(d.tset==='B'?'Sheet1':(d.sheet||'主图')):(d.wide?'Sheet1':(d.sheet||'主图'));
      const col=d.wide?`第 ${LANGS.findIndex(x=>x.c===lc)+1} 列（${langName(lc)}）`:'第 2 列（译文）';
      b.innerHTML=`
        <div class="kv">
          <dt>语言</dt><dd>${lc} ${langName(lc)}</dd>
          <dt>文件</dt><dd class="mono">${file}</dd>
          <dt>sheet</dt><dd class="mono">${sheet}</dd>
          <dt>列</dt><dd>${col}</dd>
          <dt>行</dt><dd class="mono">2 – ${d.rows||'—'}</dd>
        </div>
        <div class="note ok"><b>凭什么这么配：</b>${basisText(d)}</div>
        ${d.tset==='pending'&&!CONFLICTS[0].chosen?'<div class="note warn">表套还没定：这一格先按你选的那套算，选之前数字只是参考。</div>':''}
        <div class="note"><b>另一个版本：</b>${d.sku==='5857'?'完整表-20261003 里那张是合并版（单 sheet 68 行），和这里的结构不一样。':'这个 SKU 没有发现第二个版本。'}</div>`;
    }
    f.innerHTML=`<button class="btn" onclick="toast('已在资源管理器中定位')">在文件夹里看</button><button class="btn primary" style="margin-left:auto" onclick="closeDrawer()">好</button>`;
    return;
  }
}

/* ══════════════ 选文件夹（应用内） ══════════════ */
function openPicker(){S.picker={path:S.folder,showAll:false};render()}
function pickerGo(p){S.picker.path=p;S.picker.showAll=false;render()}
function pickerUse(){S.folder=S.picker.path;S.picker=null;toast('已切换文件夹：'+S.folder+'（只读扫描，不会改动文件）');render()}

/* ══════════════ 弹窗 ══════════════ */
function closeModal(){S.modal=null;S.picker=null;render()}
function renderModal(){
  const ov=document.getElementById('overlay'),m=document.getElementById('modal');
  const p=S.picker;
  if(p){
    ov.classList.add('open');
    const full=p.path;const sep='\\';
    const parts=full.split('\\');
    const crumb=parts.map((s,i)=>{
      const target=parts.slice(0,i+1).join('\\');
      return `<button onclick="pickerGo('${jsStr(target)}')">${s||'\\'}</button>${i<parts.length-1?'<span class="sep">›</span>':''}`;
    }).join('');
    const kids=(FS[full]||[]).slice(0,p.showAll?99:8);
    const more=(FS[full]||[]).length>8&&!p.showAll;
    m.innerHTML=`
      <div class="mh"><h3>选择工作文件夹</h3><button class="x" onclick="closeModal()">✕</button></div>
      <div class="mb">
        <div class="pathbox"><input id="pin" value="${full}" onkeydown="if(event.key==='Enter'){const v=this.value;if(FS[v]!==undefined){pickerGo(v)}else{toast('这个路径不存在或没有权限（只读列目录，不改动任何文件）')}}">
          <button class="btn" onclick="const v=document.getElementById('pin').value;if(FS[v]!==undefined){pickerGo(v)}else{toast('这个路径不存在或没有权限')}">打开</button></div>
        <div class="crumbles">${crumb}</div>
        <div class="dirlist">
          ${kids.length?kids.map(([n,d,t])=>`<button class="diritem" onclick="pickerGo('${jsStr(full+sep+n)}')">
            <span class="ic">📁</span><span class="nm">${n}</span>
            <span class="mt">${d} 份稿 · ${t} 张表</span><span class="go">›</span></button>`).join(''):
            `<div style="padding:14px;font-size:12px;color:var(--muted)">这个文件夹里没有子文件夹。</div>`}
          ${more?`<button class="diritem" onclick="S.picker.showAll=true;render()"><span class="ic">⋯</span><span class="nm">还有 ${(FS[full]||[]).length-8} 个，展开看全部</span><span class="mt"></span><span class="go">›</span></button>`:''}
        </div>
        <div class="fld"><div class="lb">最近使用</div><div class="recent">
          ${RECENT.map(r=>`<button onclick="pickerGo('${jsStr(r)}')">${r}</button>`).join('')}
        </div></div>
        <div class="note">只列出子文件夹名字和"这层有几个稿、几张表"，<b>不读表内容</b>；不会越过你选的根目录，也不会跟随快捷方式。</div>
      </div>
      <div class="mf">
        <button class="btn sm ghost" onclick="toast('新建文件夹：输入名字后就地创建（仍在你选的根目录内）')">＋ 新建文件夹</button>
        <button class="btn sm ghost" onclick="toast('已切换到系统对话框（保留给网络盘 / 没有权限的目录）')">用系统对话框…</button>
        <div class="r"><button class="btn" onclick="closeModal()">取消</button>
        <button class="btn primary" onclick="pickerUse()">选择此文件夹</button></div>
      </div>`;
    return;
  }
  if(S.modal&&S.modal.type==='exec'){
    ov.classList.add('open');
    const rows=S.modal.rows,total=rows.reduce((a,d)=>a+d.langs.length,0);
    m.innerHTML=`
      <div class="mh"><h3>确认本批执行</h3><span class="tag info">${rows.length} 稿 · ${total} 格</span><button class="x" onclick="closeModal()">✕</button></div>
      <div class="mb">
        ${rows.map(d=>`<div style="display:flex;gap:8px;align-items:center;font-size:12.3px">
          <span class="mono" style="color:var(--muted);width:44px">${d.sku}</span>
          <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${d.kind}${dupOf(d)?' · '+d.where:''}</span>
          <span style="margin-left:auto;white-space:nowrap;font-family:var(--m);font-size:11.5px">${d.langs.length} 语言 · ${d.rows} 行</span>
        </div>`).join('')}
        <div class="note warn">5857 的两份稿共用同一套表。按设计译文只算一次，但这条<b>还没实测</b>——执行后请对一次账；如果发现重复计费，立刻告诉我。</div>
        <div class="note">报价会在开跑前由服务端给出；本批 ${total} 个语言格。</div>
      </div>
      <div class="mf"><div class="r" style="margin-left:auto">
        <button class="btn" onclick="closeModal()">再想想</button>
        <button class="btn primary" onclick="S.executed=true;closeModal();toast('已提交本批：${rows.length} 稿 · ${total} 格')">确认执行</button>
      </div></div>`;
    return;
  }
  ov.classList.remove('open');
}

/* 启动 */
render();
</script>
</body>
</html>
