<!DOCTYPE html>
<html lang="zh-CN" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本地助手整改沙盘 · 2026-10-23</title>
<style>
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f7f9fc; --sunk:#e9eef5;
  --ink:#0f1623; --ink-2:#39465a; --muted:#67748a;
  --line:#d8e0ea; --line-2:#c5cedb;
  --accent:#0e7490; --accent-soft:#e0f2f7;
  --old:#b45309; --old-soft:#fdf1e3;
  --ok:#15803d; --ok-soft:#e6f5ec;
  --bad:#b91c1c; --bad-soft:#fdecec;
  --warn:#a16207; --warn-soft:#fdf6e3;
  --term:#0b1220; --term-ink:#d7e3f4; --term-dim:#7d8da6;
  --shadow:0 1px 2px rgba(15,22,35,.05),0 8px 24px -16px rgba(15,22,35,.25);
  --mono:ui-monospace,"Cascadia Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --r:12px;
}
html[data-theme="dark"]{
  --bg:#080c12; --surface:#101722; --surface-2:#0c121b; --sunk:#161f2c;
  --ink:#e7eef8; --ink-2:#bcc8d8; --muted:#8695aa;
  --line:#1e2938; --line-2:#2b394c;
  --accent:#22d3ee; --accent-soft:#0d2b33;
  --old:#fbbf24; --old-soft:#2a2110;
  --ok:#4ade80; --ok-soft:#10281a;
  --bad:#f87171; --bad-soft:#2c1414;
  --warn:#eab308; --warn-soft:#2a2310;
  --term:#05080d; --term-ink:#d7e3f4; --term-dim:#72839c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -18px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ── top bar ─────────────────────────────────────────── */
.topbar{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:12px clamp(14px,3vw,28px);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:34px;height:34px;border-radius:9px;flex:none;
  background:linear-gradient(145deg,var(--accent),#0f766e);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--mono);font-size:.82rem;font-weight:700;
  box-shadow:0 6px 14px -8px var(--accent);
}
.brand h1{font-size:.98rem;margin:0;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font-family:var(--mono);font-size:.66rem;color:var(--muted);letter-spacing:.08em;font-weight:400;margin-top:1px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--sunk);padding:3px;border-radius:10px;border:1px solid var(--line)}
.tab{
  border:0;background:transparent;padding:6px 14px;border-radius:8px;
  font-size:.82rem;color:var(--muted);white-space:nowrap;
}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.iconbtn{
  border:1px solid var(--line);background:var(--surface);border-radius:9px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);
}
.iconbtn:hover{border-color:var(--line-2)}
.topnote{font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.03em;width:100%;padding-top:2px}
@media(min-width:1100px){.topnote{width:auto;margin-left:8px;padding-top:0}}

/* ── layout ──────────────────────────────────────────── */
main{max-width:1320px;margin:0 auto;padding:clamp(16px,3vw,28px);}
.view[hidden]{display:none}
.sim{display:grid;grid-template-columns:264px minmax(0,1fr);gap:clamp(14px,2.2vw,24px);align-items:start}
.rail{position:sticky;top:86px;display:flex;flex-direction:column;gap:6px}
.rail-title{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:4px 10px 8px}
.rail button{
  display:grid;grid-template-columns:26px 1fr;gap:9px;align-items:start;text-align:left;
  border:1px solid transparent;background:transparent;border-radius:10px;padding:10px 11px;
  color:var(--ink-2);
}
.rail button:hover{background:var(--surface)}
.rail button[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow);color:var(--ink)}
.rail .n{font-family:var(--mono);font-size:.72rem;color:var(--muted);padding-top:2px}
.rail button[aria-current="true"] .n{color:var(--accent)}
.rail .t{font-size:.86rem;font-weight:600;line-height:1.4}
.rail .s{font-size:.72rem;color:var(--muted);line-height:1.45;margin-top:2px}
@media(max-width:900px){
  .sim{grid-template-columns:1fr}
  .rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:4px;gap:8px}
  .rail-title{display:none}
  .rail button{min-width:190px;background:var(--surface);border-color:var(--line)}
}

/* ── stage ───────────────────────────────────────────── */
.stage{
  background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);
  box-shadow:var(--shadow);overflow:hidden;
}
.stage-head{padding:20px clamp(16px,2.6vw,26px) 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px;
  background:radial-gradient(120% 140% at 100% 0%,var(--accent-soft) 0%,transparent 55%);
}
.stage-kicker{font-family:var(--mono);font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.stage-head h2{margin:0;font-size:clamp(1.12rem,2.4vw,1.42rem);letter-spacing:-.01em;line-height:1.35;text-wrap:balance}
.stage-goal{margin:0;color:var(--ink-2);font-size:.9rem;max-width:76ch}
.stage-body{padding:clamp(14px,2.4vw,22px)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* mode switch */
.mode-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.mode-switch{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.mode-switch button{border:0;background:transparent;border-radius:7px;padding:6px 13px;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:7px}
.mode-switch button .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5}
.mode-switch button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:600}
.mode-switch button[aria-pressed="true"][data-mode="old"]{color:var(--old)}
.mode-switch button[aria-pressed="true"][data-mode="new"]{color:var(--accent)}
.mode-hint{font-size:.76rem;color:var(--muted)}

/* machine panel */
.machine{border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:10px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:26px 26px;background-position:-1px -1px;
}
.machine > *{background:var(--surface)}
.machine-bar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:.7rem;color:var(--muted);padding:7px 10px;border-radius:8px;border:1px solid var(--line)}
.machine-bar .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.account{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.account.ok{border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.account.denied{border-color:color-mix(in srgb,var(--bad) 35%,var(--line));background:color-mix(in srgb,var(--bad-soft) 55%,var(--surface))}
.avatar{width:28px;height:28px;border-radius:8px;background:var(--sunk);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--ink-2)}
.account b{font-size:.82rem;font-family:var(--mono)}
.account small{display:block;font-size:.69rem;color:var(--muted);font-family:var(--mono)}
.filecard{border:1px solid var(--line);border-radius:9px;padding:10px 11px;display:flex;flex-direction:column;gap:7px}
.filehead{display:flex;align-items:center;gap:8px;justify-content:space-between}
.fname{font-family:var(--mono);font-size:.78rem;font-weight:600}
.ace{font-size:.72rem;color:var(--ink-2);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:6px 8px;word-break:break-all}
.result{border-radius:9px;padding:11px 12px;font-size:.86rem;font-weight:600;display:flex;align-items:center;gap:9px;border:1px solid var(--line);color:var(--muted)}
.result.idle{background:var(--sunk)}
.result.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,var(--line));color:var(--ok)}
.result.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,var(--line));color:var(--bad)}
.result.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,var(--line));color:var(--warn)}

/* pills, chips */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.66rem;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 25%,var(--line))}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 25%,var(--line))}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 25%,var(--line))}
.pill.accent{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}

/* terminal */
pre.term{
  margin:0;background:var(--term);color:var(--term-ink);border-radius:var(--r);
  padding:13px 14px;font-family:var(--mono);font-size:.73rem;line-height:1.75;
  overflow-x:auto;border:1px solid #1a2638;min-height:132px;
}
pre.term .c{color:var(--term-dim)}
pre.term .p{color:#67e8f9}
pre.term .g{color:#86efac}
pre.term .e{color:#fca5a5}
pre.term .w{color:#fcd34d}
.side{display:flex;flex-direction:column;gap:12px}

.checks{display:flex;align-items:center;gap:7px;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;background:var(--surface-2)}
.checks-title{font-size:.74rem;color:var(--muted);margin-right:2px}
.check{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.7rem;color:var(--muted);background:var(--surface)}
.check.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,var(--line));color:var(--ok)}
.check.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,var(--line));color:var(--bad)}
.hint{font-size:.73rem;color:var(--muted);margin:0;flex-basis:100%}

/* action bar */
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.btn{
  border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:8px 14px;
  font-size:.83rem;font-weight:600;display:inline-flex;align-items:center;gap:8px;color:var(--ink-2);
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme="dark"] .btn.primary{color:#04222a}
.btn.primary:hover{filter:brightness(1.07);color:inherit}
.btn.ghost{border-style:dashed}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn .k{font-family:var(--mono);font-size:.66rem;opacity:.7;font-weight:400}

/* log */
.log{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.log-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:.72rem;color:var(--muted);font-family:var(--mono);letter-spacing:.05em}
.log-head button{border:0;background:transparent;color:var(--muted);font-size:.72rem;padding:2px 6px;border-radius:5px}
.log-head button:hover{background:var(--surface);color:var(--ink)}
.log-body{padding:8px 12px;min-height:74px;max-height:230px;overflow:auto;font-family:var(--mono);font-size:.72rem;line-height:1.85;display:flex;flex-direction:column;gap:1px}
.log-line{display:grid;grid-template-columns:18px 1fr;gap:7px;animation:rise .22s ease both}
.log-line .m{color:var(--term-dim);user-select:none}
.log-line.cmd .m{color:var(--accent)}
.log-line.ok .t{color:var(--ok)}
.log-line.bad .t{color:var(--bad)}
.log-line.warn .t{color:var(--warn)}
.log-line.note .t{color:var(--muted)}
.log-empty{color:var(--muted);font-size:.73rem;padding:8px 0}
@keyframes rise{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* file grid / counters / tables */
.filegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.fcard{border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.fcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fcard .h{font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.fcard .fname{font-size:.76rem}
.fcard .hint2{font-size:.7rem;color:var(--muted);line-height:1.5}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.counter{border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;background:var(--surface-2)}
.counter .k{font-size:.73rem;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
.counter .n{font-family:var(--mono);font-size:2rem;line-height:1.2;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.counter.bad .n{color:var(--bad)}
.counter.ok .n{color:var(--ok)}
.bars{display:flex;gap:5px;align-items:flex-end;height:34px;margin-top:8px}
.bars i{display:block;width:14px;background:var(--bad);border-radius:3px 3px 0 0;opacity:.75}
.bars.ok i{background:var(--ok)}

table.grid{width:100%;border-collapse:collapse;font-size:.78rem;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
table.grid th,table.grid td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.grid thead th{background:var(--sunk);font-family:var(--mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
table.grid tbody tr:last-child td{border-bottom:0}
table.grid td.mono{font-family:var(--mono);font-size:.7rem;word-break:break-all}
table.grid tr.changed td{background:var(--bad-soft)}
table.grid tr.okrow td{background:var(--ok-soft)}
.small{font-size:.74rem;color:var(--muted)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.72rem;color:var(--muted);font-family:var(--mono)}
select{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 9px;font-family:var(--mono);font-size:.76rem;max-width:100%}
.checkline{display:flex;align-items:center;gap:8px;font-size:.76rem;color:var(--ink-2)}
.checkline input{accent-color:var(--accent);width:15px;height:15px}
.resp{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
.resp-head{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.74rem}
.resp-body{padding:10px 12px;font-family:var(--mono);font-size:.71rem;line-height:1.8;background:var(--term);color:var(--term-ink);max-height:210px;overflow:auto}
.resp-body .hk{color:#93c5fd}
.resp-body .bad{color:#fca5a5}
.resp-body .good{color:#86efac}
.verdict{margin-top:12px;border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);display:flex;gap:11px;align-items:flex-start;background:var(--surface-2)}
.verdict .ico{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;font-size:.8rem}
.verdict.ok .ico{background:var(--ok-soft);color:var(--ok)}
.verdict.bad .ico{background:var(--bad-soft);color:var(--bad)}
.verdict.warn .ico{background:var(--warn-soft);color:var(--warn)}
.verdict b{font-size:.87rem}
.verdict p{margin:2px 0 0;font-size:.78rem;color:var(--ink-2);line-height:1.55}

/* reference board */
.ref-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.ref-head h2{margin:0;font-size:1.2rem;letter-spacing:-.01em}
.filters{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.filter{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.76rem;color:var(--muted)}
.filter[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.refgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.refcard{border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;background:var(--surface);display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.refcard .top{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
.refcard h3{margin:0;font-size:.9rem;line-height:1.45}
.refcard p{margin:0;font-size:.79rem;color:var(--ink-2);line-height:1.6}
.refcard .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.refcard .why{font-size:.75rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px;line-height:1.55}

/* order */
.order{display:flex;flex-direction:column;gap:10px;max-width:900px}
.step{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:52px 1fr;gap:14px;box-shadow:var(--shadow)}
.step .id{font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:8px;height:34px;display:flex;align-items:center;justify-content:center}
.step h3{margin:0;font-size:.92rem}
.step p{margin:4px 0 0;font-size:.8rem;color:var(--ink-2);line-height:1.6}
.step .dep{font-family:var(--mono);font-size:.68rem;color:var(--muted);margin-top:6px}
.step.critical{border-left:3px solid var(--bad)}

footer{max-width:1320px;margin:0 auto;padding:20px clamp(16px,3vw,28px) 40px;color:var(--muted);font-size:.75rem;line-height:1.7;border-top:1px solid var(--line)}
footer p{margin:0 0 5px;max-width:110ch}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">砂</div>
    <div>
      <h1>本地助手整改沙盘</h1>
      <small>3.7.24 · develop@e8d3d666 · 只读推演</small>
    </div>
  </div>
  <div class="tabs" role="tablist" aria-label="视图">
    <button class="tab" role="tab" data-tab="sim" aria-selected="true">沙盘</button>
    <button class="tab" role="tab" data-tab="ref" aria-selected="false">参考决策板</button>
    <button class="tab" role="tab" data-tab="order" aria-selected="false">整改顺序</button>
  </div>
  <button class="iconbtn" id="themeBtn" title="切换明暗" aria-label="切换明暗主题">◐</button>
  <div class="topnote">模拟的是行为，不是真机读数；每条都能对到 file:line</div>
</header>

<main>
  <!-- ══ 沙盘 ══ -->
  <section class="view sim" id="view-sim" role="tabpanel" aria-label="沙盘">
    <aside class="rail" id="rail" aria-label="场景"></aside>
    <div class="stage" id="stage"></div>
  </section>

  <!-- ══ 参考决策板 ══ -->
  <section class="view" id="view-ref" role="tabpanel" aria-label="参考决策板" hidden>
    <div class="ref-head">
      <h2>参考决策板</h2>

  /* ───────── 04 HTTP ───────── */
  function httpEval(){
    const { origin, host, preflight } = state.http;
    const old = state.mode.http === 'old';
    const legitOrigin = ['https://tuyigf.com','https://test.tuyigf.com'].includes(origin);
    const localOrigin = origin === 'http://localhost:3000';
    const hostOK = ['127.0.0.1:49152','localhost:49152','[::1]:49152'].includes(host);

    if(old){
      // 旧：没有 Host 校验；Origin 只看 allowlist 或“配置被打回 localhost 默认值”
      const allowed = legitOrigin || localOrigin;
      const status = allowed ? 200 : 403;
      const headers = [];
      if(allowed) headers.push(['Access-Control-Allow-Origin', legitOrigin ? origin : 'http://localhost:3000']);
      else headers.push(['Access-Control-Allow-Origin','http://localhost:3000']);
      headers.push(['Access-Control-Allow-Methods','GET, POST, OPTIONS']);
      headers.push(['Access-Control-Allow-Headers','Content-Type, x-tygf-ticket']);
      headers.push(['Vary','（缺失）']);
      if(preflight) headers.push(['Access-Control-Allow-Private-Network','（缺失，新版 Chrome 可能拒绝）']);
      return { status, headers, old:true, hostOK:true, note: allowed ? 'Origin 被放行' : 'Origin 被拒，但响应仍回了一个误导性的 ACAO 头' };
    }

    if(!hostOK){
      return { status:421, headers:[['Vary','Origin']], old:false, hostOK:false, note:'Host 不在白名单：DNS rebinding 被挡在应用层之外' };
    }
    if(!legitOrigin){
      return { status:403, headers:[['Vary','Origin']], old:false, hostOK:true, note:'Origin 不在白名单' };
    }
    const headers = [
      ['Access-Control-Allow-Origin', origin],
      ['Access-Control-Allow-Methods','GET, POST, OPTIONS'],
      ['Access-Control-Allow-Headers','Content-Type, x-tygf-ticket'],
      ['Vary','Origin'],
    ];
    if(preflight) headers.push(['Access-Control-Allow-Private-Network','true']);
    return { status:200, headers, old:false, hostOK:true, note:'Host、Origin、PNA 三关都过' };
  }

  /* ───────── 06 evidence ───────── */
  const OBJECTS = [
    { id:'obj-101', layer:'layer-18', digest:'9f2c4b7e1a0d…c1' },
    { id:'obj-102', layer:'layer-42', digest:'3b7e9d2f6c48…a4' },
    { id:'obj-103', layer:'layer-77', digest:'d41a8c5e2b93…9f' }
  ];
  const VALID_DIGEST = '7c9e2a4d8b1f6c3e5a0d7b9f2e4c8a1d6b3f5e9c2a7d4b8f1e6c3a9d5b7f2e4c';

  function evidenceView(){
    const p = state.evidence.preset;
    if(p === 'empty') return { objects:[], digest:EMPTY_SHA, changed:-1, note:'objects 为空；摘要仍是合法的非空字符串' };
    if(p === 'missing') return { objects:OBJECTS.slice(0,2), digest:VALID_DIGEST, changed:-1, note:'第三个对象缺失，但仍有一行 VERIFIED' };
    if(p === 'tamper') return { objects:OBJECTS.map((o,i)=> i===1 ? {...o, digest:'000000000000…00'} : o), digest:VALID_DIGEST, changed:1, note:'改了第二个对象的 actualTextDigest，摘要没跟着改' };
    return { objects:OBJECTS, digest:VALID_DIGEST, changed:-1, note:'原样：对象、摘要、行集三者一致' };
  }

  function renderEvidence(){
    const old = state.mode.evidence === 'old';
    const v = evidenceView();
    const p = state.evidence.preset;
    const verdict = state.evidence.verdict;
    let vd = { tone:'', title:'等待服务端裁决', text:'选一个载荷，点“投递回执”。' };

    if(verdict === 'new-missing') vd = { tone:'ok', title:'422 / 降级 · 缺对象', text:'VERIFIED 行必须有对应对象证据；缺一个就不计费。' };

    const presets = [
      ['ok','原样'],
      ['tamper','改一个摘要'],
      ['empty','空证据（sha256("[]")）'],

    return `
    ${modeSwitch('evidence')}
    <div class="mode-row" style="margin-bottom:10px">

          <div class="top"><span class="fname">objectEvidenceDigest</span><span class="pill ${p==='empty'?'bad':'warn'}">${p==='empty'?'真实空集哈希':'示意值'}</span></div>
          <div class="h" style="word-break:break-all">${esc(v.digest)}</div>
          <div class="hint2">${esc(v.note)}</div>
        </div>
        <div class="fcard">
          <div class="top"><span class="fname">verificationLevel</span><span class="pill accent">REOPEN_VERIFIED</span></div>
          <div class="top"><span class="fname">rowResults</span><span class="pill accent">1 × VERIFIED</span></div>
        </div>
      </div>
      <div class="side">
        <div class="verdict ${vd.tone}">
          <div class="ico">${vd.tone==='ok'?'✓':vd.tone==='bad'?'✕':'·'}</div>
          <div><b>${vd.title}</b><p>${vd.text}</p></div>
        </div>
        <pre class="term">${old
          ? `<span class="c"># 旧：只认两个条件</span>
verificationLevel === 'REOPEN_VERIFIED'
typeof digest === 'string' && digest.length > 0
<span class="e">→ 空数组哈希也是非空字符串 → 通过</span>
<span class="e">→ 服务端拿不到 objects，无法重算</span>`
          : `<span class="c"># 新：拿到对象，重算</span>
objects.length > 0
digest !== sha256("[]")
new Set(objects.map(o => o.objectId)).size === objects.length
recompute(objects) === digest
VERIFIED 行 ⊆ objects
<span class="g">→ 任一不满足：422，不结算</span>`}</pre>
        <div class="actions" style="margin-top:0">
          <button class="btn primary" data-act="ev-check">投递回执</button>
        </div>
      </div>
    </div>

  function checkEvidence(){
    const old = state.mode.evidence === 'old';
    const p = state.evidence.preset;
    if(old){
      state.evidence.verdict = 'old-pass';
      push('evidence','cmd','POST /receipt（objectEvidenceDigest 非空）');
      push('evidence','bad','收费闸通过 → VERIFIED 行进入结算');
      if(p === 'empty') push('evidence','bad','注意：这个摘要是 sha256("[]")，服务端没有对象数组可重算');
    } else if(p === 'ok'){
      state.evidence.verdict = 'new-ok';
      push('evidence','cmd','服务端重算 objects');
      push('evidence','ok','摘要一致、对象数覆盖行集 → 结算 +1 行');
    } else if(p === 'empty'){
      state.evidence.verdict = 'new-empty';
      push('evidence','cmd','服务端重算 objects');
      push('evidence','bad','objects 为空 / 摘要等于 sha256("[]") → 422 EVIDENCE_OBJECTS_MISSING');
    } else if(p === 'tamper'){
      state.evidence.verdict = 'new-mismatch';
      push('evidence','cmd','服务端重算 objects');
      push('evidence','bad','重算值 ≠ 上报值 → 422 EVIDENCE_DIGEST_MISMATCH');

      state.evidence.verdict = 'new-missing';
      push('evidence','cmd','服务端重算 objects');
      push('evidence','bad','VERIFIED 行缺对应对象 → 422 / 该行降级不计费');

    }

    const f = e.target.closest('[data-filter]');
    if(f){
      state.refFilter = f.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b === f)));
      renderRef();
      return;
    }

    const b = e.target.closest('[data-act]');
    if(!b) return;
    const act = b.dataset.act;

    if(act === 'goto'){ state.sid = b.dataset.sid; render(); return; }
    if(act === 'clear-log'){ clearLog(state.sid); render(); return; }
    if(act === 'mode'){
      state.mode[state.sid] = b.dataset.mode;
      clearLog(state.sid);
      if(state.sid === 'config') state.config.result = null;
      if(state.sid === 'sign'){ state.sign.result = null; state.sign.tampered = false; }
      if(state.sid === 'http') state.http.resp = null;
      if(state.sid === 'evidence') state.evidence.verdict = null;
      if(state.sid === 'receipt') state.receipt = { acked:false, restarts:0, unknown:0, skipped:0 };
      if(state.sid === 'acl') state.acl = { runs:0, restarts:0 };
      render();
      return;
    }

    if(act === 'acl-run'){
      state.acl.runs += 1; state.acl.restarts = 0;
      const old = state.mode.acl === 'old';
      push('acl','cmd', old ? 'icacls .tygf_session /inheritance:r /grant:r ivan:F' : 'icacls .tygf_session /grant:r *S-1-5-21-3928-1105:F');

      push('config','bad','removeFile(.tygf_session.bak) 删掉上一份备份');
      push('config','bad','rename(当前 → .bak)；写入默认配置');

    }

      state.config.result = 'heal';
      push('config','cmd','readStateWithStatus() → UNREADABLE');
      push('config','ok','restrictAclToCurrentUser() 按 SID 补回 ACE（当前 + .bak）');

    }

      state.config.result = 'stop';
      push('config','cmd','readStateWithStatus() → UNREADABLE');

    if(act === 'ev-preset'){
      state.evidence.preset = b.dataset.preset;
      state.evidence.verdict = null;
      clearLog('evidence');

  /* ───────── 参考板 ───────── */

        <div class="top"><h3>${esc(r.name)}</h3><span class="pill ${tag[r.k][1]}">${tag[r.k][0]}</span></div>
        <p>${esc(r.desc)}</p>
        <div class="meta"><span class="pill">${esc(r.loc)}</span><span class="pill">证据 ${esc(r.ev)}</span></div>
        <div class="why">${esc(r.why)}</div>
      </article>`).join('');
  }

  /* ───────── 顺序 ───────── */
  const ORDER = [
    { id:'0.5', t:'身份核对', d:'客户机 /ping、release-identity、安装包签名。buildId 对不上就先升级，别在旧引擎上修新问题。', dep:'阻塞其余全部', critical:true },
    { id:'A', t:'ACL 按进程 SID + 启动自愈', d:'whoami 取 token SID，先 grant 再单独 inheritance；loadConfig 之前对当前与 .bak 各跑一次。', dep:'依赖 0.5', critical:true },
    { id:'B', t:'状态机与备份顺序', d:'五种状态；读不到就停；新备份先立、旧备份后破；start() 不再裸调 saveConfig。', dep:'与 A 同一次发布', critical:true },
    { id:'C', t:'发布闸隔离 + 签名', d:'生产无条件拒绝未签名；beta 独立目录与 manifest；installer.iss 加四个签名位。', dep:'依赖 A/B（同包发布）', critical:false },
    { id:'D', t:'回执墓碑与恢复分类', d:'ACK 前写 receipts-acked；恢复日志拆 ACKED_SKIPPED / COMPLETION_UNKNOWN；24 条先分类。', dep:'可并行，但先于数据修复', critical:false },
    { id:'1A', t:'证据重算', d:'载荷带 objects；服务端重算；空集、重复、缺对象、摘要不符全部拒绝。', dep:'独立，优先级最高', critical:true },
    { id:'1B', t:'本地 HTTP 边界', d:'Host 白名单、PNA、Vary；打包版移除 localhost:3000 回退。', dep:'依赖 B（同一版默认配置）', critical:false },
    { id:'2', t:'逆向相关取舍', d:'不做混淆；威胁模型改写；文档不再写“防破解”。', dep:'随文档与下载页一起改', critical:false }
  ];

  function renderOrder(){
    $('#orderlist').innerHTML = ORDER.map(s => `
      <div class="step ${s.critical?'critical':''}">
        <div class="id">${esc(s.id)}</div>
        <div>
          <h3>${esc(s.t)}</h3>
          <p>${esc(s.d)}</p>
          <div class="dep">${esc(s.dep)}</div>
        </div>
      </div>`).join('');
  }

  /* ───────── 主题 ───────── */
  function applyTheme(t){
    document.documentElement.dataset.theme = t;
    try{ localStorage.setItem('tygf-sandbox-theme', t); }catch(_){}
  }
  $('#themeBtn').addEventListener('click', () => {
    applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });
  try{
    const t = localStorage.getItem('tygf-sandbox-theme');
    applyTheme(t || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  }catch(_){ applyTheme('light'); }

  render();
})();
</script>
</body>
</html>
