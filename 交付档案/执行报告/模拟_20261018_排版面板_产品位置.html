  <body>
    <header class="sim-bar" id="simBar">
      <span class="brand">模拟台</span>
      <span class="note">黑条、灰条与页脚说明不属于产品；下面渲染的是整页工作台。非内联入口自动用 900px 视口预览（iframe 内可滚）。</span>
      <span class="group"><span>列宽</span>
        <a data-k="w" data-v="1280" href="?w=1280">桌面 1280</a>
        <a data-k="w" data-v="900" href="?w=900">平板 900</a>
        <a data-k="w" data-v="420" href="?w=420">420</a>
        <a data-k="w" data-v="360" href="?w=360">360</a>
      </span>
      <span class="group"><span>入口</span>
        <a data-k="placement" data-v="inline" href="?placement=inline">内联现状</a>
        <a data-k="placement" data-v="header" href="?placement=header">卡头 + 抽屉</a>
        <a data-k="placement" data-v="edge" href="?placement=edge">右缘竖签</a>
        <a data-k="placement" data-v="ball" href="?placement=ball">悬浮球</a>
        <a data-k="placement" data-v="header-ball" href="?placement=header-ball">卡头 + 悬浮球</a>
      </span>
      <span class="group"><span>细稿</span>
        <a data-k="variant" data-v="teal" href="?variant=teal">同族青</a>
        <a data-k="variant" data-v="native" href="?variant=native">原生碳</a>
        <a data-k="variant" data-v="light" href="?variant=light">轻量纸片</a>
      </span>
      <span class="group"><span>灰度</span>
        <a data-k="access" data-v="1" href="?access=1">开</a>
        <a data-k="access" data-v="0" href="?access=0">关（名单外）</a>
      </span>
      <span class="group"><span>助手写回</span>
        <a data-k="ready" data-v="1" href="?ready=1">开</a>
        <a data-k="ready" data-v="0" href="?ready=0">关</a>
      </span>
      <span class="group"><span>字体清单</span>
        <a data-k="fonts" data-v="ok" href="?fonts=ok">正常</a>
        <a data-k="fonts" data-v="none" href="?fonts=none">助手未升级</a>
      </span>
      <button type="button" id="togglePanel">展开面板</button>
      <button type="button" id="highlightPanel">标出位置</button>
      <button type="button" id="resetLocal">清空本机保存</button>
    </header>
    <p class="sim-caption" id="simCaption">（模拟台不属于产品界面）</p>
    <div class="sim-shell">
      <iframe id="simFrame" title="图译工坊工作台整页模拟"></iframe>
    </div>
